# Trivy-suppressions. Elke uitzondering geldt alleen voor het pad waarvoor hij
# is opgeschreven en verloopt vanzelf, zodat de lijst niet stil veroudert.
#
# Gelezen door .github/workflows/trivy.yml, de image-scans in build-image.yml
# (build-and-push en build-variants) en apt-security-refresh in
# check-upstream.yml. Trivy vindt dit bestand niet uit
# zichzelf — alleen `.trivyignore` wordt automatisch opgepikt — dus elke
# scanstap geeft het expliciet mee, en lokaal draaien vraagt om
# `--ignorefile .trivyignore.yaml`. Misconfig- en secret-scans worden verder
# ongefilterd gegated; bewuste uitzonderingen horen hier met reden te staan.
#
# Een verlopen regel maakt de gates in trivy.yml en build-image.yml rood. In
# apt-security-refresh, dat met exit-code 0 draait om een PR te kunnen openen,
# komt hij terug als waarschuwing in de joboutput. Zo'n rode gate of
# waarschuwing is het moment om te kijken of de uitzondering nog klopt:
# verlengen mag, maar dan met een nieuwe onderbouwing.
#
# De vorm wordt afgedwongen door .github/scripts/valideer-trivyignore.sh, dat
# in elke scanjob draait en in de workflow scriptcontroles: Trivy negeert een
# onbekende sleutel zonder melding, en dat verbergt meer dan bedoeld in plaats
# van minder.

misconfigurations:
  # De twee misconfig-uitzonderingen leggen een architectuurkeuze vast en niet
  # een wachtstand; ze verlopen daarom later dan de CVE-regels, die aan een
  # release van de betreffende tool hangen.
  - id: DS-0026
    paths:
      - "claude-sandbox/Dockerfile"
    expired_at: 2027-08-26
    statement: |
      Add HEALTHCHECK instruction in your Dockerfile (LOW).
      claude-sandbox is een interactieve dev-sandbox; het entrypoint eindigt op
      `exec sleep infinity`. Er is geen service om health van te checken — pid 1
      healthy zegt niets over de bruikbaarheid van de sandbox.

  - id: DS-0002
    paths:
      - "claude-sandbox/Dockerfile"
    expired_at: 2027-08-26
    statement: |
      Last USER command in Dockerfile should not be 'root' (HIGH).
      De container start als root omdat init-firewall.sh NET_ADMIN nodig heeft,
      en dropt in entrypoint-root.sh onherroepelijk naar `claude` (setpriv) vóór
      er iets draait dat de gebruiker aanstuurt. Er is geen weg terug: geen
      sudo, geen sudoers-regel, en de setuid/setgid-bits zijn image-breed
      gestript (Dockerfile, "Strip setuid/setgid-bits") op de podman-helpers na.

      De check gaat over de gedeclareerde image-gebruiker, niet over wie de
      workload draait. De agent bereikt de root-fase nooit. De twee paden die er
      wél naartoe leiden — `docker exec` zonder -u, en een eigen --entrypoint —
      vereisen allebei toegang tot de Docker-CLI op de host; wie die heeft kan
      ook `docker run --privileged` en is al host-root. Dat ligt buiten de grens
      die deze sandbox bewaakt. Er is geen docker-socket in de container
      gemount.

      Het alternatief (firewall in een aparte init-service, hoofdcontainer
      zonder root) is onderzocht en afgevallen: bij `restart: unless-stopped`
      komt de container na een herstart terug zonder dat die service opnieuw
      draait, wat een sandbox met open egress oplevert. Zie #98.

vulnerabilities:
  # De drie hieronder zitten in undici, dat npm via node-gyp bundelt. De
  # Dockerfile pint npm op de nieuwste 11.x; geen enkele npm-release bundelt een
  # gefixte undici, ook de volgende major niet. `apt-get upgrade` raakt ze niet:
  # Node komt van nodejs.org, niet uit apt. node-gyp gebruikt undici alleen om
  # Node-headers op te halen bij het compileren van een native addon. Twee zijn
  # een crash van npm door een vijandige server, in een sandbox die geen dienst
  # aanbiedt. De derde vraagt om een functie in de `tls`-optie; node-gyp geeft
  # alleen een CA mee, via `connect`, `requestTls` en `proxyTls`.
  #
  # Het pad bindt elke regel aan de npm-bundel: dezelfde CVE in een systeem-
  # pakket of in een eigen node_modules blijft dus gewoon rood. Haal een regel
  # weg zodra npm de dependency bumpt; check-upstream.yml opent een PR bij een
  # nieuwe npm-release, wat het moment is om dat na te lopen. Verlopen deze
  # regels, dan worden build-and-push (alleen op een pull request) en
  # build-variants rood.
  - id: CVE-2026-109869
    paths:
      - "usr/local/lib/node_modules/npm/**"
    expired_at: 2027-01-28
    statement: undici — DoS via een onafgevangen stream-fout bij te veel content-encodings, fix in 6.29.1.

  - id: CVE-2026-87018
    paths:
      - "usr/local/lib/node_modules/npm/**"
    expired_at: 2027-01-28
    statement: undici — DoS via TLS 1.2-renegotiatie met een ander certificaat, fix in 6.29.1.

  - id: CVE-2026-109383
    paths:
      - "usr/local/lib/node_modules/npm/**"
    expired_at: 2027-01-28
    statement: undici — een checkServerIdentity in de tls-optie valt weg; node-gyp gebruikt die optie niet. Fix in 6.29.1.

  # De regels hieronder zitten in de officiële release-binaries van kubectl en
  # helm (alleen bij INSTALL_FUNDAMENT=true), gescand door build-variants. Een regel
  # geldt zolang de gepinde lijn geen release met de fix heeft. Zelf bouwen
  # met een nieuwere Go of nieuwere modules zou de pin op de officiële binary
  # vervangen door een eigen build. Haal een regel weg zodra een bump van de
  # pin de CVE oplost. Het pad bindt elke regel aan die ene binary.
  - id: CVE-2026-111943
    paths:
      - "usr/local/bin/helm"
    # Kort: de risicoafweging hoort na de eerstvolgende helm-patchrelease
    # opnieuw gemaakt te worden. docs/kubernetes.md meldt deze CVE aan
    # gebruikers; die melding gaat samen met deze regel weg.
    expired_at: 2026-11-30
    statement: |
      Go-stdlib crypto/x509 (helm gebouwd met Go 1.27.2, fix in 1.27.3): MITM
      via certificaten onder door Go gedenyliste tussen-CA's. Misbruik vraagt
      een positie op het netwerkpad én zo'n certificaat. Raakt verkeer naar
      chart-repositories en OCI-registries; nauwelijks dat naar de API-server,
      die met een eigen cluster-CA werkt. Kan weg zodra een helm-release met
      Go 1.27.3 of hoger uit is.

  - id: CVE-2026-78669
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-12-31
    statement: golang.org/x/net 0.56.0 in kubectl — DoS via een overmaat aan HTTP/2 SETTINGS-frames; treft kubectl tegenover een vijandige HTTP/2-server (de API-server of een URL bij `-f`). Fix in 0.60.0, nog in geen kubectl 1.36-release.

  - id: CVE-2026-56851
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-12-31
    statement: golang.org/x/text 0.39.0 in kubectl — DoS door een out-of-bounds slice in het Nickname-profiel van x/text/secure/precis. Dat pakket is niet in kubectl gelinkt; de kwetsbare code is onbereikbaar. Fix in 0.41.0, nog in geen kubectl 1.36-release.

  - id: CVE-2026-78661
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-12-31
    statement: golang.org/x/net 0.56.0 in kubectl — DoS via HTML-invoer in de parser van x/net/html (addText, fosterParent). kubectl linkt van dat pakket alleen de Tokenizer, niet de parser; de kwetsbare code is onbereikbaar. Fix in 0.62.0, nog in geen kubectl 1.36-release.

  - id: CVE-2026-78661
    paths:
      - "usr/local/bin/helm"
    expired_at: 2026-12-31
    statement: golang.org/x/net 0.60.0 in helm — DoS via HTML-invoer in de parser van x/net/html. Dat pakket is niet in helm gelinkt; de kwetsbare code is onbereikbaar. Fix in 0.62.0, nog in geen helm 4.3-release; ook main zit op 0.61.0.

  # functl wordt vanaf de bron gebouwd, met de go.mod van upstream (alleen bij
  # INSTALL_FUNDAMENT=true), en gescand door build-variants. Zelf modules bumpen zou de
  # build laten afwijken van de gepinde, op hash gecontroleerde upstream-module.
  # check-upstream.yml opent een PR bij een nieuwe functl-commit; haal de regel
  # dan weg als die commit de module bumpt.
  - id: CVE-2026-78661
    paths:
      - "usr/local/bin/functl"
    expired_at: 2026-12-31
    statement: golang.org/x/net 0.60.0 in functl — DoS via HTML-invoer in de parser van x/net/html. Dat pakket is niet in functl gelinkt; de kwetsbare code is onbereikbaar. Fix in 0.62.0; Fundament main zit nog op 0.60.0.
