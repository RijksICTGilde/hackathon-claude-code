name: scriptcontroles

on:
  push:
    branches: [ "main" ]
  # Geen basisbranch-filter: de suppressielijst wijzigt juist in een gestapelde
  # pull request, en de scanworkflows draaien daar niet.
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Fixtures van de CI-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # De fixtures eerst: een controle die zelf stuk is, keurt alles goed.
      - name: Fixtures van de suppressie-validatie
        run: .github/scripts/test-valideer-trivyignore.sh

      - name: Fixtures van de pin-vervanging
        run: .github/scripts/test-vervang-pin.sh

      - name: Fixtures van de beschikbaarheidsvraag
        run: .github/scripts/test-apt-upgrade-beschikbaar.sh

      - name: Fixtures van de wekelijkse versiejobs
        run: .github/scripts/test-check-upstream-jobs.sh

      # kubectl en jq staan op ubuntu-latest; de fixtures falen als ze ontbreken.
      - name: Fixtures van de kubeconfig-controle
        run: .github/scripts/test-controleer-kubeconfig.sh

      # De controle op verweesde suppressies laat de matching aan Trivy zelf;
      # de fixtures hebben dus de echte trivy nodig. Dezelfde setup-trivy als
      # in trivy-action v0.36.0.
      # Houd version in sync met de default van de gepinde trivy-action.
      - name: Trivy installeren
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Fixtures van de controle op verweesde suppressies
        run: .github/scripts/test-controleer-verweesde-suppressies.sh

      - name: Fixtures van de controle op suppressie-verwijzingen
        run: .github/scripts/test-controleer-suppressie-verwijzingen.sh

      - name: Sleutels in .trivyignore.yaml afdwingen
        run: .github/scripts/valideer-trivyignore.sh

      - name: Verwijzingen naar .trivyignore.yaml in de documentatie
        run: .github/scripts/controleer-suppressie-verwijzingen.sh
