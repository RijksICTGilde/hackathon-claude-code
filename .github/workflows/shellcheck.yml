name: differential-shellcheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

permissions:
  contents: read

jobs:
  shellcheck:
    name: differential-shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR's uit deze repo, push en merge queue: volledige differentiële run met
    # SARIF-upload en PR-comment. Fork-PR's gaan naar de fallback-job.
    if: |
      (github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@f51c7c0d32777d00de777131d25918617a246415 # v5.5.7
        with:
          severity: warning
          strict-check-on-push: true
          exclude-path: |
            claude-sandbox/vendor/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # differential-shellcheck levert SARIF + PR-comment, maar faalt PRs en
      # merge-queue-runs niet op warnings (strict-check-on-push geldt alleen
      # voor push-events). Een tweede full-pass shellcheck maakt die rood
      # zodra een tracked script een warning bevat.
      - name: Fail PR on shellcheck warnings
        if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.sh' '*.bash' ':!:claude-sandbox/vendor/**')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found; nothing to check."
            exit 0
          fi
          shellcheck --severity=warning "${files[@]}"

  shellcheck-fork-pr:
    name: shellcheck (fork PR fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs cannot upload SARIF or post PR comments. Run a plain
    # shellcheck across all tracked shell scripts so external contributions
    # still get gated on shell warnings/errors.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck on tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.sh' '*.bash' ':!:claude-sandbox/vendor/**')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found; nothing to check."
            exit 0
          fi
          shellcheck --severity=warning "${files[@]}"
