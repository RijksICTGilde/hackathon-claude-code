name: build-image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Globaal read-only. De build-job verhoogt lokaal naar packages: write
# (GHCR push) en id-token: write (cosign keyless OIDC).
permissions:
  contents: read

# Voorkom dat twee snelle pushes parallelle multi-arch builds triggeren.
# Op PR branches mag een nieuwe push de lopende run cancellen (CI-minutes besparen).
# Op main en tags niet, zodat tag-builds niet door een main-push worden afgebroken.
# Veilig om PR-runs te cancellen omdat PRs niet pushen of signen; als die
# beperking ooit weggaat moet cancel-in-progress ook voor PRs naar false,
# anders kan cosign mid-flight worden afgebroken.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rijksictgilde/claude-sandbox

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC voor cosign keyless signing tegen Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PR builds zijn amd64-only om CI-tijd te besparen; arm64-regressies
      # komen pas op main aan het licht. Ze moeten single-arch blijven: de
      # image-scan hieronder leunt op `load`, en de docker-exporter kan geen
      # manifest lists exporteren. provenance/sbom worden alleen op
      # main/tag gegenereerd: ze worden bij push: false toch gebouwd
      # (buildx genereert ze tijdens build, niet tijdens push), dus uitzetten
      # op PR scheelt echt CI-tijd. Push gebeurt alleen op main/tag — een
      # workflow_dispatch op een feature-branch bouwt wel maar pushed niet,
      # zodat we nooit unsigned images naar GHCR krijgen.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: claude-sandbox
          file: claude-sandbox/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha
          # mode=max op een PR exporteert elke tussenlaag naar een PR-scoped
          # namespace die main nooit kan lezen; restore uit main blijft wel
          # werken.
          cache-to: type=gha,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }}
          provenance: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          sbom: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

      # trivy.yml scant alleen manifesten in de repo; Node.js komt als tarball van
      # nodejs.org en apt-pakketten zitten uitsluitend in de image. Deze stap dekt
      # die laag.
      #
      # Inline in deze job: de PR-build staat al in de lokale daemon (`load`), dus
      # er valt niets opnieuw te bouwen.
      #
      # Alleen op PR, en PR-builds zijn amd64-only: deze gate dekt niets van de
      # gepubliceerde multi-arch image. Die wordt wekelijks op beide architecturen
      # herscand door apt-security-refresh in check-upstream.yml, dat bij fixbare
      # bevindingen een PR opent in plaats van te blokkeren.
      #
      # `ignore-unfixed` beperkt de gate bewust tot CVE's waar upstream een fix
      # voor heeft: Debian markeert veel bevindingen als deferred of no-DSA, en
      # daarop blokkeren zou betekenen dat er niets meer kan landen tot Debian
      # beweegt. Een groene stap betekent hier dus "geen fixbare CRITICAL/HIGH",
      # niet "geen CRITICAL/HIGH". Uitzonderingen staan met reden in .trivyignore.
      # Symmetrisch met de sign-stap hieronder: een lege waarde uit de buildstap
      # mag geen stap opleveren die iets anders scant dan bedoeld.
      - name: Assert image ID present
        if: github.event_name == 'pull_request'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_ID}" ]; then
            echo "Lege imageid uit de buildstap; weigeren te scannen." >&2
            exit 1
          fi

      - name: Trivy image scan (CRITICAL/HIGH)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Install cosign
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via OIDC: ondertekent de image-digest, niet per tag.
      # Alle tags die naar dezelfde digest wijzen erven daarmee de signature.
      # De volgende stap verifieert direct dat de signature retrievable is
      # via Rekor — niet weghalen zonder verify-stap te vervangen.
      # Ref-guard: push, sign en verify worden gezamenlijk overgeslagen op
      # workflow_dispatch vanaf een feature-branch — de build draait wel
      # groen door, maar er wordt niets naar GHCR gepusht of getekend.
      # Zo komen we nooit in de toestand "gepusht maar onverifieerbaar".
      - name: Sign image with cosign
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "Empty digest from build step; refusing to sign." >&2
            exit 1
          fi
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Verify the signature we just wrote is actually retrievable from
      # Rekor. Catches transient Fulcio/Rekor write failures that cosign
      # sign itself didn't propagate (rare, but ships an unsigned image).
      # Bounded retry omdat Rekor af en toe traag of kortdurend onbereikbaar
      # is. Bij definitieve faal stopt de workflow met exit 1 zodat
      # operators handmatig kunnen ingrijpen — de :latest tag blijft
      # intussen wijzen naar de unverified digest tot iemand 'm verwijdert
      # (tag-cleanup vereist extra GHCR-rechten dan de default GITHUB_TOKEN).
      # NB: de retry behandelt elke non-zero als transient. Een echte
      # signature-mismatch faalt nog steeds na het budget, maar verbruikt
      # eerst de retry-tijd; bewuste trade-off vs. parsing van cosign-output.
      # `if:` ref-guard zelfde reden als Sign-step: zonder push+sign is
      # er geen handtekening om te verifiëren — verify zou anders falen
      # met "no matching signatures". Beide guards moeten synchroon
      # blijven; als één van beide afwijkt krijg je óf een unverified
      # image óf een gegarandeerde verify-failure.
      - name: Verify image signature
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pin issuer-ref naar refs die we daadwerkelijk ondertekenen
          # (main + semver-tags). Volledig anchored (^...$) en met
          # bounded character-class voor de tag-component, anders zou
          # cosign's substring-match `refs/heads/main-evilbranch` of een
          # tag met slashes/spaces accepteren.
          IDENTITY_REGEX="^https://github\\.com/${REPO_FULL}/\\.github/workflows/build-image\\.yml@refs/(heads/main|tags/v[0-9A-Za-z._+-]+)$"
          ISSUER="https://token.actions.githubusercontent.com"
          REF="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          attempts=3
          delay=15
          for i in $(seq 1 $attempts); do
            echo "cosign verify attempt ${i}/${attempts} for ${REF}"
            if cosign verify \
                --certificate-identity-regexp "${IDENTITY_REGEX}" \
                --certificate-oidc-issuer "${ISSUER}" \
                "${REF}"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Verify failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "cosign verify failed after ${attempts} attempts for ${REF}" >&2
          exit 1
