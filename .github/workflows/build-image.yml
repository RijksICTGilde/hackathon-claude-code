name: build-image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Globaal read-only. De build-job verhoogt lokaal naar packages: write
# (GHCR push) en id-token: write (cosign keyless OIDC).
permissions:
  contents: read

# Voorkom dat twee snelle pushes parallelle multi-arch builds triggeren.
# Op PR branches en in de merge queue mag een nieuwe run de lopende cancellen
# (CI-minutes besparen). Op main en tags niet, zodat tag-builds niet door een
# main-push worden afgebroken. Veilig omdat PR- en queue-runs niet pushen of
# signen; als die beperking ooit weggaat moet cancel-in-progress daar ook naar
# false, anders kan cosign mid-flight worden afgebroken.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rijksictgilde/claude-sandbox

jobs:
  # De optionele lagen voor sshd en Go bouwen alleen met hun toggle aan. Zonder
  # deze job draaien die paden, de `sshd -t`/`sshd -T`-asserties op de
  # hardening-drop-in en de scans op openssh en de Go-binaries nergens in CI.
  # Beide toggles in één build: de lagen raken elkaar niet, en zo kost het één
  # extra image-build per PR in plaats van een per toggle. Let op wat het niet
  # zegt: komt een laag uit de cache, dan zijn de controles in de Dockerfile niet
  # opnieuw gedraaid — een openssh-update in Debian invalideert die laag niet.
  #
  # Een eigen job en niet een stap in build-and-push: daar zou een falende build
  # ná de push maar vóór het signen kunnen landen, precies de toestand
  # 'gepusht maar onverifieerbaar' die die job uitsluit. Bouwt niets dat gepusht
  # wordt — dit is een controle, geen artefact.
  variants:
    name: build-variants
    # Niet op tags: dat vult een tag-scoped cache voor een variant die niets publiceert.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build met INSTALL_SSHD=true en INSTALL_GO=true
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: claude-sandbox
          file: claude-sandbox/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: claude-sandbox:variants-scan
          build-args: |
            INSTALL_SSHD=true
            INSTALL_GO=true
          cache-from: |
            type=gha,scope=variants
            type=gha
          cache-to: type=gha,mode=min,scope=variants
          provenance: false
          sbom: false

      # De Dockerfile controleert dit al, maar alleen als de laag niet uit de
      # cache komt. Hier draait het altijd, en zonder de Docker-ENV: zo ziet
      # een non-interactieve SSH-sessie de image.
      - name: Go, functl en GOTOOLCHAIN in de image controleren
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          for pin in GO_VERSION FUNCTL_VERSION; do
            if [ "$(grep -oE "${pin}=" claude-sandbox/Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${pin}-pin in de Dockerfile" >&2
              exit 1
            fi
          done
          go_pin=$(grep -oE 'GO_VERSION=[0-9]+\.[0-9]+\.[0-9]+' claude-sandbox/Dockerfile | cut -d= -f2) || true
          functl_pin=$(grep -oE 'FUNCTL_VERSION=v0\.0\.0-[0-9]{14}-[0-9a-f]{12}' claude-sandbox/Dockerfile | cut -d= -f2) || true
          if [ -z "$go_pin" ] || [ -z "$functl_pin" ]; then
            echo "FOUT: kon GO_VERSION ('${go_pin}') of FUNCTL_VERSION ('${functl_pin}') niet uit de Dockerfile lezen" >&2
            exit 1
          fi
          in_image() {
            docker run --rm --network none --user claude --entrypoint /usr/bin/env \
              claude-sandbox:variants-scan -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp "$@"
          }
          verwacht() { # omschrijving werkelijk verwacht
            if [ "$2" != "$3" ]; then
              echo "FOUT: $1 is '$2', verwacht '$3'" >&2
              exit 1
            fi
            echo "ok: $1 = $2"
          }
          # Eerst toewijzen: als argument van verwacht gaat de exitcode van
          # docker run verloren.
          go_versie=$(in_image go version) || { echo "FOUT: go version faalt in de image" >&2; exit 1; }
          functl_versie=$(in_image functl version) || { echo "FOUT: functl version faalt in de image" >&2; exit 1; }
          toolchain=$(in_image go env GOTOOLCHAIN) || { echo "FOUT: go env GOTOOLCHAIN faalt in de image" >&2; exit 1; }
          verwacht "go version" "$go_versie" "go version go${go_pin} linux/amd64"
          verwacht "functl version" "$functl_versie" "${functl_pin}"
          verwacht "go env GOTOOLCHAIN" "$toolchain" "local"

      # Gelijk aan de gate in build-and-push: de lijst gaat mee de language-scan in.
      - name: Sleutels in .trivyignore.yaml afdwingen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/scripts/valideer-trivyignore.sh

      # De controles en scans draaien elk ook als een eerdere ervan faalt, zodat
      # een bevinding in de ene die in de andere niet verbergt.
      #
      # De andere Trivy-runs zijn `scan-type: fs` en zien daarmee geen enkel
      # apt-pakket. openssh-server komt ongepind uit apt en valt buiten
      # Dependabot, dus zonder deze scan is er geen enkel signaal op een
      # kwetsbare sshd. ignore-unfixed houdt het actionable: alleen CVE's met
      # een beschikbare fix blokkeren, en die fix is een rebuild.
      #
      # Alleen os-pakketten: de npm-modules die met de Node.js-tarball meekomen
      # zitten net zo goed in de default-image, die hier niet gescand wordt.
      # TRIVY_PKG_TYPES i.p.v. een action-input, zodat het niet afhangt van welke
      # inputs deze versie van de action doorgeeft.
      - name: Trivy image scan, os-pakketten (CRITICAL/HIGH)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PKG_TYPES: os
        with:
          scan-type: image
          image-ref: claude-sandbox:variants-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'

      # Alleen language-pakketten: Trivy leest de buildinfo uit de Go-binaries,
      # en ziet zo de stdlib-versie van de toolchain en de modules die in functl
      # zitten. Die vallen buiten Dependabot; zonder deze scan is er geen signaal
      # op een kwetsbare dependency van functl.
      - name: Trivy image scan, language-pakketten (CRITICAL/HIGH)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PKG_TYPES: library
        with:
          scan-type: image
          image-ref: claude-sandbox:variants-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  build:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC voor cosign keyless signing tegen Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PR- en merge-queue-builds zijn amd64-only om CI-tijd te besparen;
      # arm64-regressies komen pas op main aan het licht. Ze moeten single-arch blijven: de
      # image-scan hieronder leunt op `load`, en de docker-exporter kan geen
      # manifest lists exporteren. provenance/sbom worden alleen op
      # main/tag gegenereerd: ze worden bij push: false toch gebouwd
      # (buildx genereert ze tijdens build, niet tijdens push), dus uitzetten
      # op PR scheelt echt CI-tijd. Push gebeurt alleen op main/tag — een
      # workflow_dispatch op een feature-branch bouwt wel maar pushed niet,
      # zodat we nooit unsigned images naar GHCR krijgen.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: claude-sandbox
          file: claude-sandbox/Dockerfile
          platforms: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}
          cache-from: type=gha
          # Ook mode=min schrijft PR-scoped; mode=max exporteert daar bovenop
          # elke tussenlaag, die alleen deze PR kan teruglezen en die ondertussen
          # via LRU de cache van main verdringt. Restore uit main blijft werken.
          cache-to: type=gha,mode=${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 'min' || 'max' }}
          provenance: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          sbom: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

      # trivy.yml scant alleen manifesten in de repo; Node.js komt als tarball van
      # nodejs.org en apt-pakketten zitten uitsluitend in de image. Deze stap dekt
      # die laag.
      #
      # Inline in deze job: de PR-build staat al in de lokale daemon (`load`), dus
      # er valt niets opnieuw te bouwen.
      #
      # Alleen op PR en in de merge queue, beide amd64-only: deze gate dekt
      # niets van de gepubliceerde multi-arch image. Die wordt wekelijks op beide architecturen
      # herscand door apt-security-refresh in check-upstream.yml, dat bij fixbare
      # bevindingen een PR opent in plaats van te blokkeren.
      #
      # `ignore-unfixed` beperkt de gate bewust tot CVE's waar upstream een fix
      # voor heeft: Debian markeert veel bevindingen als deferred of no-DSA, en
      # daarop blokkeren zou betekenen dat er niets meer kan landen tot Debian
      # beweegt. Een groene stap betekent hier dus "geen fixbare CRITICAL/HIGH",
      # niet "geen CRITICAL/HIGH". Uitzonderingen staan met reden in .trivyignore.yaml.
      # Symmetrisch met de sign-stap hieronder: een lege waarde uit de buildstap
      # mag geen stap opleveren die iets anders scant dan bedoeld.
      - name: Assert image ID present
        if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_ID}" ]; then
            echo "Lege imageid uit de buildstap; weigeren te scannen." >&2
            exit 1
          fi

      # De suppressielijst gaat mee de gate hieronder in; een schrijffout
      # daarin zou meer verbergen dan de lijst laat zien. trivy.yml scant de
      # repo en niet de gebouwde image, dus die gate heeft hier zijn eigen
      # controle nodig.
      - name: Sleutels in .trivyignore.yaml afdwingen
        if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        run: .github/scripts/valideer-trivyignore.sh

      - name: Trivy image scan (CRITICAL/HIGH)
        if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Install cosign
        if: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via OIDC: ondertekent de image-digest, niet per tag.
      # Alle tags die naar dezelfde digest wijzen erven daarmee de signature.
      # De volgende stap verifieert direct dat de signature retrievable is
      # via Rekor — niet weghalen zonder verify-stap te vervangen.
      # Ref-guard: push, sign en verify worden gezamenlijk overgeslagen op
      # workflow_dispatch vanaf een feature-branch — de build draait wel
      # groen door, maar er wordt niets naar GHCR gepusht of getekend.
      # Zo komen we nooit in de toestand "gepusht maar onverifieerbaar".
      - name: Sign image with cosign
        if: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "Empty digest from build step; refusing to sign." >&2
            exit 1
          fi
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Verify the signature we just wrote is actually retrievable from
      # Rekor. Catches transient Fulcio/Rekor write failures that cosign
      # sign itself didn't propagate (rare, but ships an unsigned image).
      # Bounded retry omdat Rekor af en toe traag of kortdurend onbereikbaar
      # is. Bij definitieve faal stopt de workflow met exit 1 zodat
      # operators handmatig kunnen ingrijpen — de :latest tag blijft
      # intussen wijzen naar de unverified digest tot iemand 'm verwijdert
      # (tag-cleanup vereist extra GHCR-rechten dan de default GITHUB_TOKEN).
      # NB: de retry behandelt elke non-zero als transient. Een echte
      # signature-mismatch faalt nog steeds na het budget, maar verbruikt
      # eerst de retry-tijd; bewuste trade-off vs. parsing van cosign-output.
      # `if:` ref-guard zelfde reden als Sign-step: zonder push+sign is
      # er geen handtekening om te verifiëren — verify zou anders falen
      # met "no matching signatures". Beide guards moeten synchroon
      # blijven; als één van beide afwijkt krijg je óf een unverified
      # image óf een gegarandeerde verify-failure.
      - name: Verify image signature
        if: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pin issuer-ref naar refs die we daadwerkelijk ondertekenen
          # (main + semver-tags). Volledig anchored (^...$) en met
          # bounded character-class voor de tag-component, anders zou
          # cosign's substring-match `refs/heads/main-evilbranch` of een
          # tag met slashes/spaces accepteren.
          IDENTITY_REGEX="^https://github\\.com/${REPO_FULL}/\\.github/workflows/build-image\\.yml@refs/(heads/main|tags/v[0-9A-Za-z._+-]+)$"
          ISSUER="https://token.actions.githubusercontent.com"
          REF="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          attempts=3
          delay=15
          for i in $(seq 1 $attempts); do
            echo "cosign verify attempt ${i}/${attempts} for ${REF}"
            if cosign verify \
                --certificate-identity-regexp "${IDENTITY_REGEX}" \
                --certificate-oidc-issuer "${ISSUER}" \
                "${REF}"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Verify failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "cosign verify failed after ${attempts} attempts for ${REF}" >&2
          exit 1
