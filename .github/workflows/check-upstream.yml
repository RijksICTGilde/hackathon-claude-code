name: check-upstream-dependencies

# Wekelijkse out-of-band check op SHA-pinned scripts en versie-pinned binaries.
# Doel: voorkomen dat builds onverwacht falen door een upstream-update door
# proactief PR's aan te maken zodra een upstream-versie of -SHA wijzigt.
# De Dockerfile blijft hard pinnen — dit is alleen detectie + auto-PR.

on:
  schedule:
    - cron: '0 6 * * 1'   # maandag 06:00 UTC
  workflow_dispatch:

# Globaal readonly. Jobs die een PR moeten openen overrulen lokaal naar write.
permissions:
  contents: read

# Bestanden waar deze workflow naar verwijst (Dockerfile, vendor/install-scripts/*)
# leven onder claude-sandbox/. Dit geldt alleen voor `run:`-steps; `uses:`-steps
# (checkout, peter-evans/create-pull-request) draaien vanaf de repo-root en zien
# dus de hele tree.
defaults:
  run:
    working-directory: claude-sandbox

jobs:
  # Job 1: vendored install-scripts (claude, sdkman).
  # De Dockerfile gebruikt vendor/install-scripts/<name>.sh, niet upstream.
  # Deze job detecteert wanneer upstream is gewijzigd en opent een PR die het
  # vendored bestand vervangt — de PR-diff toont meteen de echte wijziging in
  # het script (wat ook nodig is voor review).
  #
  # Alleen scripts met een ongeversioneerde upstream-URL horen hier: daar
  # detecteert een sha256-vergelijking een wijziging. Een script dat per
  # release-tag wordt gevendord (rtk) heeft een inhoudelijk onveranderlijke URL
  # en hoort in de rtk-version-job hieronder.
  vendored-scripts:
    name: "vendored-scripts (${{ matrix.name }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: claude
            url: https://claude.ai/install.sh
            file: vendor/install-scripts/claude.sh
          - name: sdkman
            url: https://get.sdkman.io
            file: vendor/install-scripts/sdkman.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare upstream script with vendored copy
        id: compare
        env:
          URL: ${{ matrix.url }}
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          curl -fsSL "$URL" -o /tmp/upstream.sh
          # Een 200 met een lege of vervangen body passeert `curl -f`; zonder
          # deze controle belandt zoiets in de vendor-map.
          if [ ! -s /tmp/upstream.sh ] || ! head -1 /tmp/upstream.sh | grep -q '^#!'; then
            echo "FOUT: het opgehaalde script van $URL is leeg of begint niet met een shebang" >&2
            exit 1
          fi
          upstream_sha=$(sha256sum /tmp/upstream.sh | awk '{print $1}')
          if [ ! -f "$FILE" ]; then
            echo "FOUT: vendored bestand '$FILE' bestaat niet" >&2
            exit 1
          fi
          current_sha=$(sha256sum "$FILE" | awk '{print $1}')
          {
            echo "current=$current_sha"
            echo "upstream=$upstream_sha"
          } >> "$GITHUB_OUTPUT"
          if [ "$upstream_sha" != "$current_sha" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp /tmp/upstream.sh "$FILE"
          # Teruglezen: een mislukte kopie zou een voorstel opleveren dat zegt
          # het bestand te hebben bijgewerkt terwijl er niets is veranderd.
          na_kopie=$(sha256sum "$FILE" | awk '{print $1}')
          if [ "$na_kopie" != "$upstream_sha" ]; then
            echo "FOUT: $FILE komt na de kopie niet overeen met de upstream-hash" >&2
            exit 1
          fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f /tmp/upstream.sh

      - name: Open auto-PR if upstream changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: deps/script-${{ matrix.name }}
          delete-branch: true
          commit-message: "chore(deps): update vendored ${{ matrix.name }} install-script"
          title: "chore(deps): update vendored ${{ matrix.name }} install-script"
          labels: dependencies
          body: |
            Wekelijkse upstream-check heeft gedetecteerd dat het install-script voor
            **${{ matrix.name }}** upstream is gewijzigd. Het vendored bestand in
            `${{ matrix.file }}` is bijgewerkt zodat de build zonder onderbreking blijft draaien.

            - **URL:** ${{ matrix.url }}
            - **Oude SHA:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe SHA:** `${{ steps.compare.outputs.upstream }}`

            Bekijk de PR-diff voor de daadwerkelijke wijziging in het script en verifieer
            lokaal met `docker compose build --no-cache` voor je merget.

  # Job 2a: Node.js LTS — vergelijkt zowel de versie als beide architectuur-SHAs.
  # Bron: nodejs.org/dist/index.json (officiële versie-feed met LTS-veld).
  node-version:
    name: node-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine latest Node.js LTS and compare
        id: compare
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.lts != false)] | first | .version' || true)
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "FOUT: kon laatste Node.js LTS-versie niet bepalen" >&2
            exit 1
          fi
          # De versie komt van buiten en belandt in curl- en sed-argumenten;
          # een `case`-patroon zou hier alles achter een spatie doorlaten.
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FOUT: onverwachte Node.js-versie '$latest' (verwacht: vX.Y.Z)" >&2
            exit 1
          fi
          current=$(grep -oE 'NODE_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige NODE_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten: een tweede pin met een ander
          # versienummer valt buiten de telling van de vervanging en zou stil
          # blijven staan onder een voorstel dat zegt hem te hebben gebumpt.
          if [ "$(grep -oE 'NODE_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één NODE_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nieuwe versie: haal beide SHAs uit de officiële SHASUMS256.txt.
          shasums=$(curl -fsSL "https://nodejs.org/dist/${latest}/SHASUMS256.txt" || true)
          sha_amd64=$(echo "$shasums" | awk -v f="node-${latest}-linux-x64.tar.xz"   '$2==f {print $1}')
          sha_arm64=$(echo "$shasums" | awk -v f="node-${latest}-linux-arm64.tar.xz" '$2==f {print $1}')
          # De checksums komen van buiten en belanden in de Dockerfile; een
          # waarde die geen sha256 is, sneuvelt anders pas bij de build.
          for sha in "$sha_amd64" "$sha_arm64"; do
            if ! [[ "$sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "FOUT: '${sha}' is geen sha256 uit SHASUMS256.txt voor ${latest}" >&2
              exit 1
            fi
          done
          # Huidige SHAs uit de Dockerfile lezen. Het patroon hangt aan
          # NODE_ARCH en niet aan de kolomuitlijning: hertabelleren van dat blok
          # zou de job anders wekelijks zwijgend laten sterven.
          for arch in x64 arm64; do
            if [ "$(grep -oP "NODE_ARCH=${arch};\\s*SHA=[a-f0-9]{64}" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één SHA-pin voor NODE_ARCH=${arch} in de Dockerfile" >&2
              exit 1
            fi
          done
          current_amd64=$(grep -oP 'NODE_ARCH=x64;\s*SHA=\K[a-f0-9]{64}' Dockerfile || true)
          current_arm64=$(grep -oP 'NODE_ARCH=arm64;\s*SHA=\K[a-f0-9]{64}' Dockerfile || true)
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "NODE_VERSION=$current" "NODE_VERSION=$latest" 1
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "$current_amd64" "$sha_amd64" 1
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "$current_arm64" "$sha_arm64" 1
          # De README tools-tabel noemt de major-versie ('Node.js <major> LTS'); bij een
          # major-bump gaat die mee in dezelfde PR. vervang-pin.sh weigert spaties,
          # dus hier een eigen telling vóór en na. Beide majors zijn hierboven al
          # als cijfers gevalideerd.
          old_major=$(echo "$current" | sed -E 's/^v([0-9]+)\..*$/\1/')
          new_major=$(echo "$latest"  | sed -E 's/^v([0-9]+)\..*$/\1/')
          if [ "$old_major" != "$new_major" ]; then
            oud="Node.js ${old_major} LTS"
            nieuw="Node.js ${new_major} LTS"
            if [ "$(grep -oF -- "$oud" README.md | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één '$oud' in README.md" >&2
              exit 1
            fi
            sed -i "s|Node\.js ${old_major} LTS|${nieuw}|" README.md
            if grep -qF -- "$oud" README.md || [ "$(grep -oF -- "$nieuw" README.md | wc -l)" -ne 1 ]; then
              echo "FOUT: README.md bevat na de vervanging niet precies één '$nieuw'" >&2
              exit 1
            fi
            echo "README.md: $oud -> $nieuw (1×)"
          fi
          {
            echo "changed=true"
            echo "amd64=$sha_amd64"
            echo "arm64=$sha_arm64"
            echo "current_amd64=$current_amd64"
            echo "current_arm64=$current_arm64"
            echo "major_change=$([ "$old_major" != "$new_major" ] && echo true || echo false)"
            echo "old_major=$old_major"
            echo "new_major=$new_major"
          } >> "$GITHUB_OUTPUT"

      # Een nieuwe release kan een gedeelde library vereisen die niet in de
      # slim-base zit; de build faalt dan pas op `node --version`. Deze stap
      # vergelijkt de NEEDED-entries van de huidige en de nieuwe binary per
      # architectuur en zet een nieuw vereiste library in de PR-beschrijving.
      - name: Compare shared-library dependencies
        id: libs
        if: steps.compare.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.compare.outputs.current }}
          LATEST: ${{ steps.compare.outputs.latest }}
          CURRENT_X64: ${{ steps.compare.outputs.current_amd64 }}
          CURRENT_ARM64: ${{ steps.compare.outputs.current_arm64 }}
          LATEST_X64: ${{ steps.compare.outputs.amd64 }}
          LATEST_ARM64: ${{ steps.compare.outputs.arm64 }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          needed() { # versie arch sha -> gesorteerde NEEDED-sonames op stdout
            local v="$1" a="$2" sha="$3" t="${tmp}/node-$1-linux-$2.tar.xz"
            curl -fsSL "https://nodejs.org/dist/${v}/node-${v}-linux-${a}.tar.xz" -o "$t"
            echo "${sha}  ${t}" | sha256sum -c --quiet -
            tar -xJf "$t" -C "$tmp" "node-${v}-linux-${a}/bin/node"
            readelf -d "${tmp}/node-${v}-linux-${a}/bin/node" \
              | sed -nE 's/.*\(NEEDED\).*\[(.+)\]$/\1/p' | sort -u
          }
          nieuwe_libs=""
          for arch in x64 arm64; do
            case "$arch" in
              x64)   oud_sha="$CURRENT_X64";   nieuw_sha="$LATEST_X64" ;;
              arm64) oud_sha="$CURRENT_ARM64"; nieuw_sha="$LATEST_ARM64" ;;
            esac
            needed "$CURRENT" "$arch" "$oud_sha" > "${tmp}/oud-${arch}.txt"
            needed "$LATEST" "$arch" "$nieuw_sha" > "${tmp}/nieuw-${arch}.txt"
            # Elke Node-binary linkt tegen libc; ontbreekt die, dan heeft het
            # uitlezen gefaald en zou een lege lijst als "niets nieuws" lezen.
            for lijst in "${tmp}/oud-${arch}.txt" "${tmp}/nieuw-${arch}.txt"; do
              if ! grep -qx 'libc.so.6' "$lijst"; then
                echo "FOUT: geen libc.so.6 in de NEEDED-lijst van $(basename "$lijst" .txt) (${arch})" >&2
                exit 1
              fi
            done
            while read -r soname; do
              # De soname komt uit een gedownloade binary en belandt in de PR-tekst.
              if ! [[ "$soname" =~ ^[A-Za-z0-9._+-]+$ ]]; then
                echo "FOUT: onverwachte soname '${soname}' in node ${LATEST} (${arch})" >&2
                exit 1
              fi
              nieuwe_libs="${nieuwe_libs:+${nieuwe_libs}, }\`${soname}\` (${arch})"
            done < <(comm -13 "${tmp}/oud-${arch}.txt" "${tmp}/nieuw-${arch}.txt")
          done
          echo "nieuwe libraries: ${nieuwe_libs:-geen}"
          echo "nieuwe_libs=${nieuwe_libs}" >> "$GITHUB_OUTPUT"
          rm -rf "$tmp"

      - name: Open auto-PR if Node.js LTS changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: deps/node
          delete-branch: true
          commit-message: "chore(deps): bump Node.js to ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump Node.js to ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe Node.js LTS-release gedetecteerd op nodejs.org/dist.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **SHA amd64:** `${{ steps.compare.outputs.amd64 }}`
            - **SHA arm64:** `${{ steps.compare.outputs.arm64 }}`

            ${{ steps.compare.outputs.major_change == 'true' && format('**Let op:** major-versie wijzigt van {0} naar {1}. De README tools-tabel is meegenomen (`Node.js {0} LTS` → `Node.js {1} LTS`).', steps.compare.outputs.old_major, steps.compare.outputs.new_major) || '' }}

            ${{ steps.libs.outputs.nieuwe_libs != '' && format('**Let op:** de nieuwe binary vereist gedeelde libraries die de huidige niet nodig heeft: {0}. Voeg het bijbehorende Debian-pakket toe aan de apt-laag van de Dockerfile en de README tools-tabel; zonder dat pakket faalt de build op `node --version`.', steps.libs.outputs.nieuwe_libs) || '' }}

            Verifieer lokaal met `docker compose build --no-cache` voor je merget.

  # Job 2a-bis: npm — eigen release-lijn, los van Node. De npm die met de
  # Node-tarball meekomt loopt achter, en die achterstand zit in modules die npm
  # bundelt (tar, undici, brace-expansion). Zonder deze job is een Trivy-melding
  # het enige signaal, en dat is reactief: pas als iemand een CVE publiceert.
  #
  # Blijft binnen dezelfde major als de pin: een major-bump hoort een eigen
  # afweging te zijn en zou hier wekelijks dezelfde PR opleveren.
  npm-version:
    name: npm-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine latest npm within the pinned major and compare
        id: compare
        run: |
          set -euo pipefail
          # Beide `|| true`'s: onder `set -e` met pipefail zou een niet-matchende
          # grep of een gefaalde curl de stap beëindigen voor de foutmelding
          # eronder wordt bereikt.
          current=$(grep -oE 'NPM_VERSION=[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige npm-versie niet uit de Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten; zie de toelichting bij node-version.
          if [ "$(grep -oE 'NPM_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één NPM_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          major=${current%%.*}
          # Alleen stabiele versies binnen dezelfde major; pre-releases (11.0.0-pre)
          # sorteren anders mee en leveren een onbruikbare pin op.
          latest=$(curl -fsSL https://registry.npmjs.org/npm \
            | jq -r --arg m "$major" '.versions | keys[] | select(test("^" + $m + "\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            echo "FOUT: kon laatste npm-versie binnen major $major niet bepalen" >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "NPM_VERSION=$current" "NPM_VERSION=$latest" 1
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if npm changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: deps/npm
          delete-branch: true
          commit-message: "chore(deps): bump npm to ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump npm to ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe npm-release binnen major ${{ steps.compare.outputs.major }} gedetecteerd op registry.npmjs.org.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`

            npm bundelt zijn eigen dependencies (`tar`, `undici`, `brace-expansion`,
            `ip-address`). Loop bij het reviewen `.trivyignore.yaml` na: staat er een
            suppressie voor een module die deze release bumpt, haal die dan weg.

            Verifieer lokaal met `docker compose build --no-cache` voor je merget.

  # Job 2b: git-delta — GitHub release-tracking + per-arch SHAs (zelf berekenen,
  # geen officiële SHA-feed beschikbaar).
  delta-version:
    name: delta-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine latest delta release and compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/dandavison/delta/releases/latest --jq .tag_name || true)
          if [ -z "$latest" ]; then
            echo "FOUT: kon laatste delta-versie niet bepalen via de GitHub API" >&2
            exit 1
          fi
          # De tag komt uit een repository van derden en belandt hieronder in
          # curl- en sed-argumenten. Een `case`-patroon is hier te zwak: de
          # glob-`*` matcht ook een spatie en alles erachter.
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FOUT: onverwachte delta-tag '$latest' (verwacht: X.Y.Z)" >&2
            exit 1
          fi
          current=$(grep -oE 'DELTA_VERSION=[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige DELTA_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten; zie de toelichting bij node-version.
          if [ "$(grep -oE 'DELTA_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één DELTA_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Download beide assets en bereken SHAs zelf.
          tmpdir=$(mktemp -d)
          curl -fsSL -o "$tmpdir/amd64.deb" \
            "https://github.com/dandavison/delta/releases/download/${latest}/git-delta_${latest}_amd64.deb"
          curl -fsSL -o "$tmpdir/arm64.deb" \
            "https://github.com/dandavison/delta/releases/download/${latest}/git-delta_${latest}_arm64.deb"
          # `curl -f` weert alleen HTTP-fouten; een 200 met een andere body
          # levert een keurige SHA over de verkeerde inhoud, die pas bij de
          # image-build sneuvelt.
          for arch in amd64 arm64; do
            if [ ! -s "$tmpdir/${arch}.deb" ]; then
              echo "FOUT: de ${arch}-download van delta is leeg" >&2
              exit 1
            fi
            if ! head -c 8 "$tmpdir/${arch}.deb" | grep -q '^!<arch>'; then
              echo "FOUT: de ${arch}-download van delta is geen .deb-archief" >&2
              exit 1
            fi
          done
          sha_amd64=$(sha256sum "$tmpdir/amd64.deb" | awk '{print $1}')
          sha_arm64=$(sha256sum "$tmpdir/arm64.deb" | awk '{print $1}')
          rm -rf "$tmpdir"
          # Huidige SHAs uit de Dockerfile lezen. Het patroon hangt aan de
          # case-tak en niet aan de kolomuitlijning: hertabelleren van dat blok
          # zou de job anders wekelijks zwijgend laten sterven.
          for arch in amd64 arm64; do
            if [ "$(grep -oP "${arch}\\)\\s*SHA=[a-f0-9]{64}" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${arch}-SHA-pin voor delta in de Dockerfile" >&2
              exit 1
            fi
          done
          current_amd64=$(grep -oP 'amd64\)\s*SHA=\K[a-f0-9]{64}' Dockerfile || true)
          current_arm64=$(grep -oP 'arm64\)\s*SHA=\K[a-f0-9]{64}' Dockerfile || true)
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "DELTA_VERSION=$current" "DELTA_VERSION=$latest" 1
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "$current_amd64" "$sha_amd64" 1
          "${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh" Dockerfile "$current_arm64" "$sha_arm64" 1
          {
            echo "changed=true"
            echo "amd64=$sha_amd64"
            echo "arm64=$sha_arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if delta changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: deps/delta
          delete-branch: true
          commit-message: "chore(deps): bump git-delta to ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump git-delta to ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe git-delta-release gedetecteerd op GitHub.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **SHA amd64:** `${{ steps.compare.outputs.amd64 }}`
            - **SHA arm64:** `${{ steps.compare.outputs.arm64 }}`
            - **Release notes:** https://github.com/dandavison/delta/releases/tag/${{ steps.compare.outputs.latest }}

            Verifieer lokaal met `docker compose build --no-cache` voor je merget.

  # Job 2c: rtk — volgt de release-tag zelf, omdat het script per tag wordt
  # gevendord en een sha256-diff tegen die URL dus nooit iets detecteert.
  # Bumpt de vier plekken die samen moeten verschuiven: het vendored script, de
  # herkomst-URL, RTK_VERSION en de vermelding in de README. Een aparte SHA-pin voor de binary is niet
  # nodig: het script verifieert die tegen de checksums.txt van dezelfde release.
  rtk-version:
    name: rtk-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine latest rtk release and compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/rtk-ai/rtk/releases/latest --jq .tag_name || true)
          if [ -z "$latest" ]; then
            echo "FOUT: kon laatste rtk-versie niet bepalen via de GitHub API" >&2
            exit 1
          fi
          # De tag komt uit een repository van derden en belandt hieronder in
          # curl- en sed-argumenten. Een `case`-patroon is hier te zwak: de
          # glob-`*` matcht ook een spatie en alles erachter, dus 'v1.0.0; rm'
          # zou erdoor komen. `=~` toetst de hele waarde, waar een regexp per
          # regel ook een tweede regel zou doorlaten.
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FOUT: onverwachte rtk-tag '$latest' (verwacht: vX.Y.Z)" >&2
            exit 1
          fi
          # Zonder `|| true` beëindigt een gefaalde grep de stap voor de
          # foutmelding eronder wordt bereikt.
          current=$(grep -oE 'RTK_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige RTK_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten; zie de toelichting bij node-version.
          if [ "$(grep -oE 'RTK_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één RTK_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Byte-identiek aan de upstream-tag houden, zodat de herkomst
          # controleerbaar blijft. Eerst naar een tijdelijk bestand: een lege
          # of ontbrekende download zou anders stil in de vendor-map belanden
          # onder een voorstel dat zegt het script te hebben bijgewerkt.
          nieuw_script=$(mktemp)
          curl -fsSL "https://raw.githubusercontent.com/rtk-ai/rtk/${latest}/install.sh" \
            -o "$nieuw_script"
          if [ ! -s "$nieuw_script" ]; then
            echo "FOUT: het opgehaalde rtk-install-script is leeg" >&2
            exit 1
          fi
          if ! head -1 "$nieuw_script" | grep -q '^#!'; then
            echo "FOUT: het opgehaalde rtk-install-script begint niet met een shebang" >&2
            exit 1
          fi
          mv "$nieuw_script" vendor/install-scripts/rtk.sh
          # Per vorm apart, niet als telling van twee: anders is "twee
          # voorkomens" een proxy voor "de goede twee plekken", en zou een derde
          # vermelding de herkomst-URL ongemerkt op de oude tag laten staan
          # terwijl de telling toch klopt.
          vervang="${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh"
          "$vervang" Dockerfile "RTK_VERSION=$current" "RTK_VERSION=$latest" 1
          "$vervang" Dockerfile "rtk-ai/rtk/$current/install.sh" "rtk-ai/rtk/$latest/install.sh" 1
          "$vervang" README.md "$current" "$latest" 1
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if rtk changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: deps/rtk
          delete-branch: true
          commit-message: "chore(deps): bump rtk to ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump rtk to ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe rtk-release gedetecteerd op GitHub. Bijgewerkt zijn het vendored
            install-script, de herkomst-URL in de `Dockerfile`, de `RTK_VERSION`-pin
            en de vermelding in `README.md`.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **Release notes:** https://github.com/rtk-ai/rtk/releases/tag/${{ steps.compare.outputs.latest }}

            Bekijk de diff van `vendor/install-scripts/rtk.sh`: dat script draait tijdens
            de image-build. Verifieer daarna lokaal met `docker compose build --no-cache`
            voor je merget.

  # Job 2d: Go — versie en beide architectuur-SHAs, uit de officiële feed van
  # go.dev. Bij een nieuwe minor verschuift de vermelding in de README mee.
  go-version:
    name: go-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine latest stable Go release and compare
        id: compare
        run: |
          set -euo pipefail
          # Eén keer ophalen: versie en checksums komen zo uit dezelfde feed.
          if ! feed=$(curl -fsSL 'https://go.dev/dl/?mode=json'); then
            echo "FOUT: kon de Go-feed van go.dev niet ophalen" >&2
            exit 1
          fi
          # Numeriek sorteren: de volgorde van de feed is geen contract. Een
          # misvormd versiedeel telt als -1 in plaats van jq te laten falen; is
          # zo'n versie de hoogste, dan weigert de vormtoets hieronder hem.
          if ! latest=$(jq -r '[.[] | select(.stable == true) | .version | strings]
                | sort_by(ltrimstr("go") | split(".") | map(tonumber? // -1))
                | last // empty' <<<"$feed"); then
            echo "FOUT: de Go-feed is geen leesbare JSON-lijst van releases" >&2
            exit 1
          fi
          if [ -z "$latest" ]; then
            echo "FOUT: kon laatste stabiele Go-versie niet bepalen" >&2
            exit 1
          fi
          # De versie komt van buiten en belandt in curl- en sed-argumenten;
          # een `case`-patroon zou hier alles achter een spatie doorlaten.
          if ! [[ "$latest" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FOUT: onverwachte Go-versie '$latest' (verwacht: goX.Y.Z)" >&2
            exit 1
          fi
          latest=${latest#go}
          current=$(grep -oE 'GO_VERSION=[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige GO_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten; zie de toelichting bij node-version.
          if [ "$(grep -oE 'GO_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één GO_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          # Ook bij gelijke versie: een verdwenen SHA-pin hoort niet pas bij de
          # volgende release op te vallen. Eigen namen (GO_SHA), zodat de
          # telling van de delta-job er niet over struikelt.
          for arch in amd64 arm64; do
            if [ "$(grep -oP "${arch}\\)\\s*GO_SHA=[a-f0-9]{64}" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${arch}-SHA-pin voor Go in de Dockerfile" >&2
              exit 1
            fi
          done
          {
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Een lagere versie dan de pin wijst op een kapotte of teruggezette
          # feed, niet op een gewenste downgrade.
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "FOUT: Go ${latest} uit de feed is lager dan de pin ${current}" >&2
            exit 1
          fi
          # De checksums uit de feed vertrouwen, zoals node-version de
          # SHASUMS256.txt van nodejs.org: zelf downloaden en hashen zegt niets
          # extra's over de herkomst. De build toetst de tarball ertegen.
          sha_amd64=$(jq -r --arg f "go${latest}.linux-amd64.tar.gz" \
            '.[].files[]? | select(.filename == $f and .kind == "archive") | .sha256' <<<"$feed")
          sha_arm64=$(jq -r --arg f "go${latest}.linux-arm64.tar.gz" \
            '.[].files[]? | select(.filename == $f and .kind == "archive") | .sha256' <<<"$feed")
          for sha in "$sha_amd64" "$sha_arm64"; do
            if ! [[ "$sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "FOUT: '${sha}' is geen sha256 uit de Go-feed voor go${latest}" >&2
              exit 1
            fi
          done
          current_amd64=$(grep -oP 'amd64\)\s*GO_SHA=\K[a-f0-9]{64}' Dockerfile)
          current_arm64=$(grep -oP 'arm64\)\s*GO_SHA=\K[a-f0-9]{64}' Dockerfile)
          vervang="${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh"
          "$vervang" Dockerfile "GO_VERSION=$current" "GO_VERSION=$latest" 1
          "$vervang" Dockerfile "GO_SHA=$current_amd64" "GO_SHA=$sha_amd64" 1
          "$vervang" Dockerfile "GO_SHA=$current_arm64" "GO_SHA=$sha_arm64" 1
          # De tools-tabel in de README noemt alleen major.minor; zo verschuiven
          # tabel en Dockerfile in dezelfde commit. vervang-pin.sh weigert een
          # spatie, dus de minor staat hier los; precies één treffer bewaakt dat
          # er niets anders meeverschuift.
          if [ "${current%.*}" != "${latest%.*}" ]; then
            "$vervang" README.md "${current%.*}" "${latest%.*}" 1
          fi
          {
            echo "changed=true"
            echo "amd64=$sha_amd64"
            echo "arm64=$sha_arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if Go changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/go
          delete-branch: true
          commit-message: "chore(deps): bump Go naar ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump Go naar ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe stabiele Go-release gedetecteerd op go.dev/dl. Bij een nieuwe
            minor-versie is ook de vermelding in `README.md` bijgewerkt.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **SHA amd64:** `${{ steps.compare.outputs.amd64 }}`
            - **SHA arm64:** `${{ steps.compare.outputs.arm64 }}`
            - **Release notes:** https://go.dev/doc/devel/release

            Verifieer lokaal met `INSTALL_FUNDAMENT=true docker compose build --no-cache` voor je merget.
            Deze PR is door `GITHUB_TOKEN` geopend en start daardoor geen workflow-runs; sluit en
            heropen hem om de checks alsnog te laten draaien.

  # Job 2e: functl — Fundament publiceert alleen de rolling release
  # `functl-latest`. De commit uit die release wordt een pseudo-versie, en de
  # h1-hash komt uit de checksum-database van Go; de build toetst de module
  # daar zelf nog eens tegen bij `go mod download`.
  functl-version:
    name: functl-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine functl-latest commit and compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=fundament-oss/fundament
          module="github.com/${repo}"
          max_dagen=30
          if ! body=$(gh api "repos/${repo}/releases/tags/functl-latest" --jq .body); then
            echo "FOUT: kon de release functl-latest niet ophalen via de GitHub-API" >&2
            exit 1
          fi
          # Een release-body kan CRLF-regeleinden hebben; de `\r` zou anders
          # in de commit belanden en de toets hieronder laten falen.
          body=$(tr -d '\r' <<<"$body")
          if [ "$(grep -c '^- Commit: ' <<<"$body" || true)" -ne 1 ]; then
            echo "FOUT: verwacht precies één '- Commit:'-regel in de release functl-latest" >&2
            exit 1
          fi
          commit=$(sed -n 's/^- Commit: //p' <<<"$body")
          # De commit komt uit een repository van derden en belandt hieronder
          # in curl-URL's; alleen een volledige hash is hier geldig.
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FOUT: onverwachte commit '$commit' in functl-latest (verwacht: 40 hex-tekens)" >&2
            exit 1
          fi
          # Stopt upstream met verversen van de rolling release, dan blijft
          # deze job anders wekelijks groen op een verouderde pin. published_at
          # helpt niet: die wordt bij verversen niet bijgewerkt.
          if ! stand=$(gh api "repos/${repo}/compare/${commit}...master" \
                 --jq '"\(.ahead_by) \(.base_commit.commit.committer.date)"'); then
            echo "FOUT: kon commit ${commit} niet met master vergelijken via de GitHub-API" >&2
            exit 1
          fi
          read -r voor datum <<<"$stand"
          if ! [[ "$voor" =~ ^[0-9]+$ && "$datum" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "FOUT: onverwachte vergelijking van ${commit} met master ('${stand}')" >&2
            exit 1
          fi
          dagen=$(( ($(date -u +%s) - $(date -u -d "$datum" +%s)) / 86400 ))
          if [ "$voor" -gt 0 ] && [ "$dagen" -gt "$max_dagen" ]; then
            echo "FOUT: functl-latest staat op ${commit} (${dagen} dagen oud) en master loopt ${voor} commits voor; upstream ververst de rolling release niet meer" >&2
            exit 1
          fi
          if ! info=$(curl -fsSL "https://proxy.golang.org/${module}/@v/${commit}.info"); then
            echo "FOUT: kon de module-info van commit ${commit} niet ophalen via proxy.golang.org" >&2
            exit 1
          fi
          if ! latest=$(jq -r '.Version // empty' <<<"$info"); then
            echo "FOUT: de module-info van proxy.golang.org is geen leesbare JSON" >&2
            exit 1
          fi
          if [ -z "$latest" ]; then
            echo "FOUT: kon de pseudo-versie van commit ${commit} niet bepalen via proxy.golang.org" >&2
            exit 1
          fi
          if ! [[ "$latest" =~ ^v0\.0\.0-[0-9]{14}-[0-9a-f]{12}$ ]]; then
            echo "FOUT: onverwachte pseudo-versie '$latest' (verwacht: v0.0.0-<tijd>-<commit>)" >&2
            exit 1
          fi
          # Zonder deze toets kan de proxy een geldig gevormde versie van een
          # andere commit teruggeven, en pint de PR iets anders dan de release.
          if [ "${latest##*-}" != "${commit:0:12}" ]; then
            echo "FOUT: pseudo-versie '$latest' hoort niet bij commit ${commit}" >&2
            exit 1
          fi
          current=$(grep -oE 'FUNCTL_VERSION=v0\.0\.0-[0-9]{14}-[0-9a-f]{12}' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige FUNCTL_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin per naam; zie de toelichting bij node-version.
          for pin in FUNCTL_VERSION FUNCTL_H1; do
            if [ "$(grep -oE "${pin}=" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${pin}-pin in de Dockerfile" >&2
              exit 1
            fi
          done
          current_h1=$(grep -oE 'FUNCTL_H1=h1:[A-Za-z0-9+/]{43}=' Dockerfile | cut -d= -f2- || true)
          if [ -z "$current_h1" ]; then
            echo "FOUT: kon huidige FUNCTL_H1 niet uit Dockerfile lezen" >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "commit=$commit"
            echo "old_commit=${current##*-}"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Een oudere commit dan de pin is geen bump maar een teruggezette of
          # vervalste release. Beide versies zijn op vorm getoetst, dus het
          # tijdstempel staat op een vaste plek en vergelijkt als tekst.
          if [[ "${latest:7:14}" < "${current:7:14}" ]]; then
            echo "FOUT: pseudo-versie '$latest' is ouder dan de pin '$current'" >&2
            exit 1
          fi
          lookup=$(curl -fsSL "https://sum.golang.org/lookup/${module}@${latest}" || true)
          h1=$(awk -v m="$module" -v v="$latest" '$1 == m && $2 == v {print $3}' <<<"$lookup")
          if ! [[ "$h1" =~ ^h1:[A-Za-z0-9+/]{43}=$ ]]; then
            echo "FOUT: geen geldige h1-hash voor ${module}@${latest} uit sum.golang.org ('${h1}')" >&2
            exit 1
          fi
          # GOTOOLCHAIN=local: een `go`-regel boven de gepinde Go laat de
          # image-build falen. Dat blokkeert de bump niet, maar de PR moet het
          # zeggen, want dan hoort er eerst een Go-bump bij.
          mod=$(curl -fsSL "https://proxy.golang.org/${module}/@v/${latest}.mod" || true)
          go_mod=$(awk '$1 == "go" {print $2}' <<<"$mod")
          if ! [[ "$go_mod" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "FOUT: onverwachte go-regel '${go_mod}' in de go.mod van ${module}@${latest}" >&2
            exit 1
          fi
          go_pin=$(grep -oE 'GO_VERSION=[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$go_pin" ]; then
            echo "FOUT: kon huidige GO_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          go_te_laag=false
          if [ "$(printf '%s\n%s\n' "$go_pin" "$go_mod" | sort -V | tail -1)" != "$go_pin" ]; then
            go_te_laag=true
            echo "::warning::go.mod van ${module}@${latest} vraagt go ${go_mod}, de Dockerfile pint Go ${go_pin}"
          fi
          vervang="${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh"
          "$vervang" Dockerfile "FUNCTL_VERSION=$current" "FUNCTL_VERSION=$latest" 1
          "$vervang" Dockerfile "FUNCTL_H1=$current_h1" "FUNCTL_H1=$h1" 1
          {
            echo "changed=true"
            echo "h1=$h1"
            echo "go_mod=$go_mod"
            echo "go_pin=$go_pin"
            echo "go_te_laag=$go_te_laag"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if functl changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/functl
          delete-branch: true
          commit-message: "chore(deps): bump functl naar ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump functl naar ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe commit achter de rolling release `functl-latest` van Fundament.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **h1:** `${{ steps.compare.outputs.h1 }}` (sum.golang.org)
            - **`go`-regel in go.mod:** `${{ steps.compare.outputs.go_mod }}`; de Dockerfile pint Go `${{ steps.compare.outputs.go_pin }}`
            - **Wijzigingen:** https://github.com/fundament-oss/fundament/compare/${{ steps.compare.outputs.old_commit }}...${{ steps.compare.outputs.commit }}

            ${{ steps.compare.outputs.go_te_laag == 'true' && format('**Let op:** de go.mod vraagt Go {0}, de Dockerfile pint Go {1}. Met `GOTOOLCHAIN=local` faalt de image-build; merge eerst een Go-bump naar minstens {0}.', steps.compare.outputs.go_mod, steps.compare.outputs.go_pin) || '' }}

            Loop bij het reviewen `.trivyignore.yaml` na: staat er een suppressie op `usr/local/bin/functl`
            voor een module die deze commit bumpt, haal die dan weg.

            `functl` draait tijdens de image-build (`functl version`). Bekijk de wijzigingen
            en verifieer lokaal met `INSTALL_FUNDAMENT=true docker compose build --no-cache` voor je merget.
            Deze PR is door `GITHUB_TOKEN` geopend en start daardoor geen workflow-runs; sluit en
            heropen hem om de checks alsnog te laten draaien.

  # Job 3: Debian-security-updates in de gepubliceerde image. Waarom de
  # `apt-get upgrade`-laag een epoch nodig heeft staat bij de ARG in de
  # Dockerfile.
  #
  # De image-scan in build-image.yml draait alleen op PR-builds en die zijn
  # amd64-only, dus de gepubliceerde multi-arch image wordt daar niet gedekt.
  # Deze job scant hem wekelijks op beide architecturen, elk op de digest uit de
  # manifest list — `:latest` zou naar het platform van de runner resolven.
  apt-security-refresh:
    name: apt-security-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      IMAGE_REPO: ghcr.io/rijksictgilde/claude-sandbox
      # Drempel waarboven een verversings-PR opengaat, ook zonder bevindingen.
      # Patchen is een cyclus, geen reactie op een scannerdrempel: de scan ziet
      # alleen fixbare CRITICAL/HIGH, dus MEDIUM en LOW komen alleen binnen via
      # een rebuild — deze verversing of een Dependabot-bump van de
      # base-digest. 28 is vier keer de wekelijkse cron: staat de epoch op de
      # crondag, dan valt de vierde run precies op de drempel in plaats van
      # erover.
      MAX_EPOCH_AGE_DAYS: '28'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ook nodig wanneer het package publiek is: anonieme GHCR-pulls lopen
      # tegen een lagere rate limit aan.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De digests komen uit het register en belanden hieronder in een image-ref:
      # valideren op vorm voor ze verder gaan.
      - name: Resolve per-architecture digests
        id: digests
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "${IMAGE_REPO}:latest" --format '{{json .Manifest}}')
          resolved=()
          for arch in amd64 arm64; do
            digest=$(jq -r --arg a "$arch" \
              '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a) | .digest] | first // ""' \
              <<<"$manifest")
            if ! grep -qE '^sha256:[0-9a-f]{64}$' <<<"$digest"; then
              echo "FOUT: geen bruikbare linux/${arch}-digest in ${IMAGE_REPO}:latest (waarde: '${digest}')" >&2
              jq -c '[.manifests[]?.platform]' <<<"$manifest" >&2
              exit 1
            fi
            resolved+=("$digest")
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
          # De manifest list hoort twee verschillende digests te bevatten;
          # gelijke digests wijzen op een kapotte publicatie.
          if [ "${resolved[0]}" = "${resolved[1]}" ]; then
            echo "FOUT: amd64 en arm64 verwijzen naar dezelfde digest (${resolved[0]})" >&2
            exit 1
          fi

      - name: Sleutels in .trivyignore.yaml afdwingen
        working-directory: ${{ github.workspace }}
        run: .github/scripts/valideer-trivyignore.sh

      # Zelfde severity, ignore-unfixed en suppressies als de gate in
      # build-image.yml; een amd64-bevinding hier voorspelt daar dus een falende
      # gate. Voor arm64 bestaat die tegenhanger niet. Exit-code 0: deze job
      # opent een PR in plaats van te falen.
      - name: Trivy scan of published image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPO }}@${{ steps.digests.outputs.amd64 }}
          format: json
          output: /tmp/trivy-amd64.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml
          list-all-pkgs: true
          exit-code: '0'

      - name: Trivy scan of published image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPO }}@${{ steps.digests.outputs.arm64 }}
          format: json
          output: /tmp/trivy-arm64.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml
          list-all-pkgs: true
          exit-code: '0'
          # De binary zit na de vorige stap in de tool-cache.
          skip-setup-trivy: true

      - name: Bump APT_UPGRADE_EPOCH if needed
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Alleen os-pkgs komt uit apt. Bevindingen in de npm-bundel of in de
          # gepinde binaries (Node, git-delta, rtk) lost een bump van deze laag
          # niet op; die volgen hun eigen versiepin, met een eigen job hierboven.
          os='[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]?]'
          rest='[.Results[]? | select(.Class != null and .Class != "os-pkgs") | .Vulnerabilities[]?]'
          fields='{id: .VulnerabilityID, sev: .Severity, pkg: .PkgName, inst: .InstalledVersion, fix: .FixedVersion}'
          : > /tmp/os-all.json
          : > /tmp/rest-all.json
          : > /tmp/geinstalleerd.json
          for arch in amd64 arm64; do
            report="/tmp/trivy-${arch}.json"
            # Een crashende scan maakt de stap rood, maar een scan die netjes
            # exit 0 geeft over het verkeerde ding niet: OS niet herkend, of een
            # rapport over de andere architectuur. Assert daarom per
            # architectuur dat er werkelijk een Debian-image van díe
            # architectuur met apt-pakketten is gescand.
            if [ ! -s "$report" ]; then
              echo "FOUT: $report ontbreekt of is leeg; de scanstap heeft niets weggeschreven" >&2
              exit 1
            fi
            family=$(jq -r '.Metadata.OS.Family // ""' "$report" || true)
            if [ "$family" != "debian" ]; then
              echo "FOUT: geen Debian-OS gedetecteerd in $report (family='${family}'); de apt-laag is niet gescand" >&2
              exit 1
            fi
            scanned_arch=$(jq -r '.Metadata.ImageConfig.architecture // ""' "$report" || true)
            if [ "$scanned_arch" != "$arch" ]; then
              echo "FOUT: $report bevat een '${scanned_arch}'-image, verwacht ${arch}" >&2
              exit 1
            fi
            os_targets=$(jq "[.Results[]? | select(.Class == \"os-pkgs\")] | length" "$report" || true)
            case "$os_targets" in
              ''|*[!0-9]*|0)
                echo "FOUT: geen os-pkgs-target in $report; de apt-laag is niet gescand" >&2
                exit 1 ;;
            esac
            arch_count=$(jq "$os | group_by(.VulnerabilityID) | length" "$report" || true)
            case "$arch_count" in
              ''|*[!0-9]*)
                echo "FOUT: geen bruikbare telling van bevindingen in $report (waarde: '${arch_count}')" >&2
                exit 1 ;;
            esac
            echo "Gescand: ${arch} (${family}), ${os_targets} os-pkgs-target(s), ${arch_count} fixbare CRITICAL/HIGH."
            jq --arg arch "$arch" "$os   | map($fields + {arch: \$arch})" "$report" >> /tmp/os-all.json
            jq --arg arch "$arch" "$rest | map($fields + {arch: \$arch})" "$report" >> /tmp/rest-all.json
            # Geïnstalleerde apt-pakketten: de invoer voor de vraag of er
            # überhaupt iets te upgraden valt. De volledige versie zit in `ID`
            # (naam@versie); `Version` bevat alleen het upstream-deel, zonder
            # epoch en revisie, en zou elke vergelijking laten kloppen.
            zonder_id=$(jq '[.Results[]? | select(.Class == "os-pkgs") | .Packages[]? | select(.ID == null)] | length' "$report")
            if [ "$zonder_id" -ne 0 ]; then
              echo "FOUT: ${zonder_id} pakket(ten) in $report zonder ID; de volledige versie is daar niet uit te lezen" >&2
              exit 1
            fi
            jq --arg arch "$arch" \
              '[.Results[]? | select(.Class == "os-pkgs") | .Packages[]?
                | {pkg: .Name, inst: (.ID | sub("^.*@"; "")), arch: $arch}]' \
              "$report" >> /tmp/geinstalleerd.json
          done
          # Tellen per CVE-ID over beide architecturen samen: één CVE die tien
          # pakketten op twee architecturen raakt is één bevinding. `ruw` is
          # alles wat de scan meldde; `count` telt alleen wat een verversing
          # werkelijk kan raken en is daarmee de telling waarop besloten wordt.
          ruw=$(jq -s 'add | [.[].id] | unique | length' /tmp/os-all.json || true)
          other=$(jq -s 'add | [.[].id] | unique | length' /tmp/rest-all.json || true)
          for var in ruw other; do
            case "${!var}" in
              ''|*[!0-9]*)
                echo "FOUT: geen bruikbare telling uit /tmp/os-all.json of /tmp/rest-all.json (${var}='${!var}')" >&2
                head -c 500 /tmp/os-all.json >&2
                exit 1 ;;
            esac
          done
          if [ "$other" -gt 0 ]; then
            echo "::warning::${other} fixbare CRITICAL/HIGH buiten de apt-pakketten; die volgen hun eigen versiepin, niet APT_UPGRADE_EPOCH"
          fi
          # `|| true`: zonder match zou grep onder pipefail de stap laten
          # eindigen voor de foutmelding hieronder wordt bereikt.
          current=$(grep -oE '^ARG APT_UPGRADE_EPOCH=[0-9]{4}-[0-9]{2}-[0-9]{2}$' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon ARG APT_UPGRADE_EPOCH niet uit Dockerfile lezen" >&2
            exit 1
          fi
          if [ "$(grep -c '^ARG APT_UPGRADE_EPOCH=' Dockerfile)" -ne 1 ]; then
            echo "FOUT: meerdere APT_UPGRADE_EPOCH-regels; de bump zou er maar één verversen" >&2
            exit 1
          fi
          new=$(date -u +%F)
          # De regex hierboven dekt de vorm, niet de semantiek: 2026-02-30 komt
          # er doorheen en zou verderop op een rekenfout stranden.
          current_seconds=$(date -u -d "$current" +%s) || {
            echo "FOUT: APT_UPGRADE_EPOCH '${current}' is geen bestaande datum" >&2
            exit 1
          }
          now_seconds=$(date -u +%s)
          # Op seconden vergelijken: integer-deling kapt af richting nul, dus een
          # epoch van morgen zou als leeftijd 0 langs deze guard glippen.
          if [ "$current_seconds" -gt "$now_seconds" ]; then
            echo "FOUT: APT_UPGRADE_EPOCH (${current}) ligt in de toekomst; de periodieke verversing slaat pas ${MAX_EPOCH_AGE_DAYS} dagen ná die datum aan" >&2
            exit 1
          fi
          age=$(( ( now_seconds - current_seconds ) / 86400 ))
          # Een leeftijd ver boven de drempel betekent dat eerdere verversingen
          # niet zijn geland: meestal een PR die blijft liggen of een rebuild van
          # :latest die nog moet komen, soms een schedule dat GitHub na
          # langdurige repo-inactiviteit heeft uitgeschakeld.
          if [ "$age" -ge $(( MAX_EPOCH_AGE_DAYS * 2 )) ]; then
            echo "::warning::APT_UPGRADE_EPOCH is ${age} dagen oud, ruim boven de drempel ${MAX_EPOCH_AGE_DAYS}; staat de verversings-PR nog open, of draaien de wekelijkse runs niet meer?"
          fi
          # De uitsluitingslijst wordt uit de Dockerfile afgeleid in plaats van
          # apart bijgehouden: een tweede `dpkg -i` zou anders stil gaan
          # meewegen (week na week een voorstel dat het pakket meteen weer op
          # zijn eigen pin terugzet), en een naam die er blijft staan terwijl
          # het pakket inmiddels uit apt komt, zou zijn bevindingen voorgoed
          # wegfilteren. De bestandsnaam van de `.deb` is de pakketnaam; klopt
          # die aanname niet, dan valt dat op omdat het pakket niet in de scan
          # voorkomt.
          # `|| true`: zonder match zou grep onder pipefail de stap laten eindigen
          # nog voor de melding hieronder wordt bereikt.
          # Commentregels eruit: die noemen `dpkg -i` juist om uit te leggen wat
          # hier gebeurt, en zouden anders als installatie meetellen.
          grep -vE '^[[:space:]]*#' Dockerfile > "${RUNNER_TEMP:-/tmp}/dockerfile-zonder-comments"
          buiten_apt=$({ grep -oE 'dpkg[[:space:]]+(-i|--install)[[:space:]]+[^[:space:]]+\.deb' \
              "${RUNNER_TEMP:-/tmp}/dockerfile-zonder-comments" || true; } \
            | sed -E 's|.*/||; s|\.deb$||' | sort -u | jq -R . | jq -sc .)
          # Voorkomens tellen, geen regels: twee installaties op één regel zijn
          # ook twee installaties.
          dpkg_regels=$({ grep -oE 'dpkg[[:space:]]+(-i|--install)' \
            "${RUNNER_TEMP:-/tmp}/dockerfile-zonder-comments" || true; } | wc -l)
          afgeleid=$(jq 'length' <<<"$buiten_apt")
          if [ "$dpkg_regels" -ne "$afgeleid" ]; then
            echo "FOUT: ${dpkg_regels} dpkg-installatie(s) in de Dockerfile, maar ${afgeleid} pakketnaam/-namen af te leiden; de vorm is niet herkend" >&2
            grep -nE 'dpkg[[:space:]]+(-i|--install)' "${RUNNER_TEMP:-/tmp}/dockerfile-zonder-comments" >&2 || true
            exit 1
          fi
          echo "Buiten de apt-laag geïnstalleerd volgens de Dockerfile: ${buiten_apt}"
          # Pakketten die niet uit de apt-laag komen, kan een epoch-bump niet
          # bewegen: ze worden verderop in de Dockerfile op een eigen versie
          # gepind en volgen hun eigen wekelijkse job. Een voorstel op grond van
          # zo'n pakket verhelpt niets en bouwt drie keer voor niets.
          jq -s --argjson buiten "$buiten_apt" \
            'add | map(select(.pkg as $p | $buiten | index($p) | not))' \
            /tmp/os-all.json > /tmp/os-samen.json
          for pkg in $(jq -r '.[]' <<<"$buiten_apt"); do
            gevonden=$(jq -s --arg p "$pkg" '[add[] | select(.pkg == $p)] | length' /tmp/os-all.json)
            [ "$gevonden" -eq 0 ] || echo "Buiten de weging gelaten: ${gevonden} bevinding(en) op ${pkg}, dat buiten apt om wordt gepind."
          done
          # De kandidaat komt altijd uit een amd64-container, maar de
          # geïnstalleerde versies van beide architecturen worden gewogen: bouwt
          # arm64 op een ander moment, of heeft een pakket daar een eigen
          # binNMU-revisie, dan zou een achterstand op die architectuur anders
          # nooit een verversing uitlokken. Een binNMU is hoger dan het
          # amd64-origineel, dus dat geeft geen vals alarm.
          jq -s --argjson buiten "$buiten_apt" \
            'add | map(select(.pkg as $p | $buiten | index($p) | not)) | unique_by([.pkg, .inst])' \
            /tmp/geinstalleerd.json > /tmp/geinstalleerd-samen.json
          # De pakketlijst die we voorleggen is de unie van beide architecturen:
          # een pakket dat alleen op arm64 een bevinding heeft, zou anders geen
          # kandidaat krijgen en dat leest als "de fix staat niet in de suite".
          jq -s '[add[].pkg] | unique' \
            /tmp/geinstalleerd.json /tmp/os-all.json > /tmp/te-vragen.json
          count=$(jq '[.[].id] | unique | length' /tmp/os-samen.json)
          case "$count" in
            ''|*[!0-9]*)
              echo "FOUT: geen bruikbare telling uit /tmp/os-samen.json (waarde: '${count}')" >&2
              exit 1 ;;
          esac
          if [ "$count" -ne "$ruw" ]; then
            echo "Van de ${ruw} fixbare CRITICAL/HIGH raken er ${count} de apt-laag; de rest zit op een pakket dat buiten apt om gepind is."
          fi
          beoordeel="${GITHUB_WORKSPACE}/.github/scripts/apt-upgrade-beschikbaar.sh"

          # De policy-uitvoer wordt hoogstens één keer opgehaald, en alleen als
          # er iets te beslissen valt.
          policy_opgehaald=0
          haal_policy() {
            [ "$policy_opgehaald" -eq 0 ] || return 0
            local aantal gedekt basis rc
            local -a pakketten
            mapfile -t pakketten < <(jq -r '.[]' /tmp/te-vragen.json)
            aantal=$(jq -r '[.[].pkg] | unique | length' /tmp/geinstalleerd-samen.json)
            if [ "${#pakketten[@]}" -eq 0 ] || [ "$aantal" -eq 0 ]; then
              echo "FOUT: geen geïnstalleerde apt-pakketten uit de scan; de vraag wat er te halen valt is niet te stellen" >&2
              exit 1
            fi
            # De namen komen uit een scanrapport en gaan als losse argumenten naar
            # een container, niet als shell-string; deze controle gaat dus over
            # de vraag of we het juiste vragen, niet over injectie. In jq
            # toetsen en niet op de gelezen regels: een naam waar een newline in
            # zit, ligt na het lezen al in tweeën, en beide helften zouden er
            # dan geldig uitzien. Het echte pakket wordt nooit gevraagd en
            # krijgt "geen kandidaat" — een stille nee.
            afwijkend=$(jq -r '[.[] | select((gsub("[a-z0-9+.-]"; "")) != "" or (test("^[a-z0-9]") | not))] | length' /tmp/te-vragen.json)
            case "$afwijkend" in
              ''|*[!0-9]*)
                echo "FOUT: de naamcontrole gaf geen bruikbare telling (waarde: '${afwijkend}')" >&2
                exit 1 ;;
            esac
            if [ "$afwijkend" -ne 0 ]; then
              echo "FOUT: ${afwijkend} onverwachte pakketnaam/-namen in de scanuitvoer; niet doorgegeven aan de container" >&2
              jq -r '.[] | select((gsub("[a-z0-9+.-]"; "")) != "" or (test("^[a-z0-9]") | not)) | @json' /tmp/te-vragen.json >&2
              exit 1
            fi
            # Dezelfde basis-image als de Dockerfile, dus dezelfde suite, en een
            # fractie van de gepubliceerde image om binnen te halen.
            basis=$(grep -oE '^FROM debian:[^@[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile | head -1 | cut -d' ' -f2 || true)
            if [ -z "$basis" ]; then
              echo "FOUT: kon de basis-image niet uit de Dockerfile lezen" >&2
              exit 1
            fi
            # `apt-get update` geeft exitcode 0 als een deel van de indexen
            # niet op te halen is; valt juist de security-suite weg, dan ziet de
            # vraag geen enkele security-fix en leest dat als "niets te halen".
            rc=0
            # `apt-get update` schrijft zijn voortgang naar stdout; dat hoort
            # niet in het bestand dat straks geparsed wordt. De indextargets
            # gaan mee als bewijs welke bronnen daadwerkelijk zijn gebruikt.
            docker run --rm "$basis" sh -c \
              'apt-get update >&2 && apt-get indextargets --format "\$(SITE) \$(RELEASE)" \
                 | sed "s/^/INDEX /" && apt-cache policy "$@"' _ "${pakketten[@]}" \
              > /tmp/policy.txt 2> /tmp/policy-fouten.txt || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FOUT: de policy-container eindigde met exitcode ${rc}" >&2
              cat /tmp/policy-fouten.txt >&2
              exit 1
            fi
            # Ook op het goede pad meekijken: hier komt de voortgang van
            # `apt-get update` terecht, en een melding uit de container die
            # nergens op matcht zou anders spoorloos verdwijnen.
            if [ -s /tmp/policy-fouten.txt ]; then
              echo "Meldingen uit de policy-container:"
              head -c 2000 /tmp/policy-fouten.txt
            fi
            fetch_rc=0
            grep -qE 'Failed to fetch|Some index files failed' /tmp/policy-fouten.txt || fetch_rc=$?
            if [ "$fetch_rc" -gt 1 ]; then
              echo "FOUT: de controle op indexfouten kon niet draaien (grep exitcode ${fetch_rc})" >&2
              exit 1
            fi
            if [ "$fetch_rc" -eq 0 ]; then
              echo "FOUT: apt-get update kon niet alle indexen ophalen; de beschikbaarheid is niet vast te stellen" >&2
              cat /tmp/policy-fouten.txt >&2
              exit 1
            fi
            # Niet-leeg zegt niets: elke afwijking in het uitvoerformaat zou
            # stil "geen kandidaat" opleveren voor álle pakketten en daarmee
            # elke verversing tegenhouden.
            # Alleen de geïnstalleerde pakketten moeten gedekt zijn: een naam
            # die alleen uit een bevinding komt kan ontbreken omdat de suite hem
            # niet kent, en dat is een antwoord, geen kapotte meting.
            jq -r '[.[].pkg] | unique | .[] + ":"' /tmp/geinstalleerd-samen.json > /tmp/verwachte-koppen.txt
            # `|| true` zou ook exitcode 2 opvangen — een onleesbaar bestand of
            # een ongeldig patroon — en dat levert een lege telling op waarmee
            # de vergelijking hieronder zelf faalt. In een `if`-conditie grijpt
            # `set -e` daar niet op in, dus de controle zou stil overgeslagen
            # worden.
            grep_rc=0
            gedekt=$(grep -cxFf /tmp/verwachte-koppen.txt /tmp/policy.txt) || grep_rc=$?
            if [ "$grep_rc" -gt 1 ]; then
              echo "FOUT: de dekkingscontrole kon niet draaien (grep exitcode ${grep_rc})" >&2
              exit 1
            fi
            case "$gedekt" in
              ''|*[!0-9]*)
                echo "FOUT: geen bruikbare dekkingstelling uit de policy-uitvoer (waarde: '${gedekt}')" >&2
                exit 1 ;;
            esac
            # Een enkel ontbrekend pakket is een antwoord: de suite kent het
            # niet, en het script leest dat verderop als "geen kandidaat". Nul
            # dekking is geen antwoord maar een kapotte meting — een ander
            # uitvoerformaat, een andere taal, of een update die geen enkele
            # index binnenhaalde.
            if [ "$gedekt" -eq 0 ]; then
              echo "FOUT: apt-cache policy noemt geen enkel van de ${aantal} geïnstalleerde pakketten; de policy-uitvoer is niet gelezen zoals verwacht" >&2
              head -c 500 /tmp/policy.txt >&2
              exit 1
            fi
            # Een enkel pakket dat de suite niet kent is een antwoord; loopt de
            # basis-image zover uit de pas met de gepubliceerde image dat een
            # tiende van de namen onbekend is, dan wordt er meer geraden dan
            # gemeten.
            if [ $(( gedekt * 10 )) -lt $(( aantal * 9 )) ]; then
              echo "FOUT: apt-cache policy noemt maar ${gedekt} van de ${aantal} geïnstalleerde pakketten; te veel om de uitkomst een meting te noemen" >&2
              exit 1
            fi
            # De pakketten die de bevindingen dragen moeten er állemaal in staan.
            # Voor een geïnstalleerd pakket is "de suite kent het niet" nog een
            # antwoord; voor een pakket waar een fixbare CVE op zit is het dat
            # niet — dan is de vraag of die fix er is simpelweg niet gesteld.
            jq -r '[.[].pkg] | unique | .[] + ":"' /tmp/os-samen.json > /tmp/cve-koppen.txt
            if [ -s /tmp/cve-koppen.txt ]; then
              cve_rc=0
              cve_gedekt=$(grep -cxFf /tmp/cve-koppen.txt /tmp/policy.txt) || cve_rc=$?
              if [ "$cve_rc" -gt 1 ]; then
                echo "FOUT: de dekkingscontrole op bevindingen kon niet draaien (grep exitcode ${cve_rc})" >&2
                exit 1
              fi
              cve_verwacht=$(wc -l < /tmp/cve-koppen.txt)
              if [ "$cve_gedekt" -lt "$cve_verwacht" ]; then
                echo "FOUT: van de ${cve_verwacht} pakketten met een fixbare bevinding noemt apt-cache policy er ${cve_gedekt}; voor de rest is de vraag niet gesteld" >&2
                exit 1
              fi
            fi
            if [ "$gedekt" -lt "$aantal" ]; then
              echo "::warning::apt-cache policy noemt ${gedekt} van de ${aantal} geïnstalleerde pakketten; de rest kent deze suite niet — buiten apt om geïnstalleerd, of alleen aanwezig in de index van de andere architectuur"
            fi
            # Koppen zonder kandidaten is dezelfde kapotte meting, één laag
            # dieper: de namen worden herkend maar de versietabel niet.
            kandidaten=0
            grep_rc=0
            kandidaten=$(grep -c '^  Candidate:' /tmp/policy.txt) || grep_rc=$?
            if [ "$grep_rc" -gt 1 ]; then
              echo "FOUT: de controle op kandidaten kon niet draaien (grep exitcode ${grep_rc})" >&2
              exit 1
            fi
            if [ "$kandidaten" -eq 0 ]; then
              echo "FOUT: geen enkele Candidate-regel in de policy-uitvoer; het formaat is niet wat de beoordeling verwacht" >&2
              head -c 500 /tmp/policy.txt >&2
              exit 1
            fi
            # Zonder indexen valt apt terug op /var/lib/dpkg/status en levert het
            # gewoon kandidaten: de versies die al in de image zitten. Elke
            # vergelijking komt dan op "niets te halen" uit, en dat is geen
            # antwoord maar een meting zonder bron. Een kandidaat uit een
            # archief is te herkennen aan de herkomstregel in de versietabel.
            uit_archief=0
            grep_rc=0
            uit_archief=$(grep -cE '^ +[0-9]+ [^/]' /tmp/policy.txt) || grep_rc=$?
            if [ "$grep_rc" -gt 1 ]; then
              echo "FOUT: de controle op de herkomst van de kandidaten kon niet draaien (grep exitcode ${grep_rc})" >&2
              exit 1
            fi
            if [ "$uit_archief" -eq 0 ]; then
              echo "FOUT: geen enkele kandidaat komt uit een archief; apt viel terug op de pakketstatus van de image en heeft geen suite geraadpleegd" >&2
              head -c 500 /tmp/policy.txt >&2
              exit 1
            fi
            if ! grep -q '^INDEX .*-security' /tmp/policy.txt; then
              echo "FOUT: geen security-index in de gebruikte apt-bronnen; een fix uit de security-suite zou onzichtbaar blijven" >&2
              grep '^INDEX ' /tmp/policy.txt >&2 || true
              exit 1
            fi
            policy_opgehaald=1
          }

          # Exitcode 1 betekent "niets te halen", 2 of hoger betekent dat de
          # vraag niet beantwoord is; dat laatste mag niet als "nee" tellen.
          beschikbaar() { # modus bestand
            local rc=0
            "$beoordeel" "$1" "$2" /tmp/policy.txt || rc=$?
            case "$rc" in
              0) return 0 ;;
              1) return 1 ;;
              *) echo "FOUT: de beschikbaarheidsvraag kon niet beantwoord worden (exitcode ${rc})" >&2; exit 1 ;;
            esac
          }

          # Een openstaand voorstel wordt niet elke week herschreven: een
          # force-push zet er een nieuwe datum in en maakt de review-run die
          # iemand daarop startte achterhaald.
          open_pr=$(gh pr list --head deps/apt-security-refresh --state open --json number --jq '.[0].number // ""') || {
            echo "FOUT: kon niet nagaan of er al een voorstel openstaat" >&2
            exit 1
          }
          if [ -n "$open_pr" ]; then
            # Zolang het voorstel blijft liggen wordt de vraag niet eens
            # gesteld. Staat de epoch dan al over de drempel, dan is dat geen
            # routinematige overslag meer maar een verversing die niet landt.
            echo "Verversing overgeslagen: er staat al een voorstel open op deps/apt-security-refresh (#${open_pr})."

            if [ "$age" -ge "$MAX_EPOCH_AGE_DAYS" ]; then
              echo "::warning::voorstel #${open_pr} staat nog open terwijl APT_UPGRADE_EPOCH ${age} dagen oud is (drempel ${MAX_EPOCH_AGE_DAYS}); de verversing landt niet"
            fi

            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reason=""
          if [ "$count" -gt 0 ]; then
            haal_policy
            echo "Fixes die de suite nu uitlevert:"

            if beschikbaar cve /tmp/os-samen.json; then
              reason="${count} fixbare CRITICAL/HIGH-CVE('s) in Debian-pakketten, waarvan minstens één nu op te halen"
            else
              echo "::warning::${count} fixbare CRITICAL/HIGH-CVE('s), maar geen enkele fix staat in de suite"
            fi
          fi
          # De periodieke verversing staat los van de CVE-vraag: een fix die
          # blijft steken mag de routine niet maandenlang bevriezen, want die
          # haalt ook alle andere beschikbare updates op.
          if [ -z "$reason" ] && [ "$age" -ge "$MAX_EPOCH_AGE_DAYS" ]; then
            haal_policy
            echo "Pakketten met een hogere kandidaat:"

            if beschikbaar upgrade /tmp/geinstalleerd-samen.json; then
              reason="periodieke verversing: APT_UPGRADE_EPOCH is ${age} dagen oud"
            else
              echo "::warning::periodieke verversing overgeslagen: de epoch is ${age} dagen oud, maar geen pakket heeft een hogere kandidaat dan wat er in de image staat"
            fi
          fi
          if [ -z "$reason" ]; then
            echo "Geen verversing: niets fixbaars op te halen, epoch is ${age} dagen oud (drempel ${MAX_EPOCH_AGE_DAYS})."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" = "$new" ]; then
            # Al vandaag gebumpt: een tweede bump levert dezelfde inhoud op en
            # dus een lege commit.
            echo "::warning::${reason}, maar APT_UPGRADE_EPOCH staat al op ${new}; geen PR. De rebuild van :latest moet nog langskomen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|^ARG APT_UPGRADE_EPOCH=${current}$|ARG APT_UPGRADE_EPOCH=${new}|" Dockerfile
          grep -qx "ARG APT_UPGRADE_EPOCH=${new}" Dockerfile || {
            echo "FOUT: bump van APT_UPGRADE_EPOCH is niet toegepast" >&2
            exit 1
          }
          # Eén regel per unieke combinatie van CVE, pakket en versiepaar.
          # Architecturen met hetzelfde versiepaar staan samen op één regel;
          # verschillen de versies, dan krijgt elke architectuur een eigen
          # regel. Het aantal regels kan daarom hoger liggen dan de telling, die
          # per CVE-ID gaat.
          #
          # De delimiter-filter op de jq-uitvoer is een vangnet: de regels
          # beginnen altijd met een streepje, dus scanuitvoer kan de
          # GITHUB_OUTPUT-heredoc niet vroegtijdig afsluiten.
          if [ "$count" -gt 0 ]; then
            summary=$(jq -rs 'add
                              | group_by([.id, .pkg, .inst, .fix])
                              | .[]
                              | "- `\(.[0].id)` (\(.[0].sev)) — \(.[0].pkg): `\(.[0].inst)` → `\(.[0].fix)` (\([.[].arch] | unique | join(", ")))"' \
                       /tmp/os-samen.json | { grep -vFx 'TRIVY_EOF' || true; })
          else
            summary="- Geen openstaande fixbare CRITICAL/HIGH; dit is de periodieke verversing."
          fi
          {
            echo 'summary<<TRIVY_EOF'
            printf '%s\n' "$summary"
            echo 'TRIVY_EOF'
            echo "current=$current"
            echo "new=$new"
            echo "reason=$reason"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if a bump is needed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: deps/apt-security-refresh
          delete-branch: true
          # De Trivy-stappen laten hun DB-cache in de workspace achter; zonder
          # add-paths commit de action die mee en weigert GitHub de push.
          add-paths: claude-sandbox/Dockerfile
          commit-message: "chore(deps): bump APT_UPGRADE_EPOCH naar ${{ steps.compare.outputs.new }}"
          title: "chore(deps): apt security-updates ophalen (APT_UPGRADE_EPOCH ${{ steps.compare.outputs.new }})"
          labels: dependencies
          body: |
            Aanleiding: ${{ steps.compare.outputs.reason }}, gemeten op
            `${{ env.IMAGE_REPO }}:latest` over linux/amd64 en linux/arm64.
            `APT_UPGRADE_EPOCH` is gebumpt zodat de `apt-get upgrade`-laag opnieuw draait
            in plaats van uit de layer cache te komen.

            - **Oude waarde:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe waarde:** `${{ steps.compare.outputs.new }}`

            Bevindingen (één regel per CVE, pakket en versiepaar; architecturen met
            hetzelfde versiepaar staan samen op één regel):

            ${{ steps.compare.outputs.summary }}

            Verifieer lokaal met `docker compose build --no-cache` voor je merget. Deze PR is
            door `GITHUB_TOKEN` geopend en start daardoor geen workflow-runs; sluit en heropen
            hem om de checks alsnog te laten draaien. Blijft er na de rebuild iets staan, dan is
            er voor dat pakket nog geen Debian-update in de suite. Dat is niet
            hetzelfde als "geen fix": kijk eerst of de suite hem later alsnog
            uitlevert, en pas als dat aantoonbaar niet gebeurt hoort hij met
            reden in `.trivyignore.yaml`.

  # Job 4a: kubectl — bewust op één minor gepind (zie de comment bij
  # de kubectl-laag in de Dockerfile), dus deze job volgt alleen patches via
  # stable-<minor>.txt. Een nieuwere minor in stable.txt wordt gemeld, niet
  # gebumpt: die keuze volgt de clusterversies en hoort een eigen afweging te zijn.
  kubectl-version:
    name: kubectl-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine latest kubectl patch within the pinned minor and compare
        id: compare
        run: |
          set -euo pipefail
          current=$(grep -oE 'KUBECTL_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige KUBECTL_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten; zie de toelichting bij node-version.
          if [ "$(grep -oE 'KUBECTL_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één KUBECTL_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          # Ook bij gelijke versie: een verdwenen SHA-pin hoort niet pas bij de
          # volgende patch op te vallen. Eigen namen (KUBECTL_SHA), zodat de
          # telling van de delta-job er niet over struikelt. De lookahead weigert
          # een hash van meer dan 64 tekens.
          declare -A pin
          for arch in amd64 arm64; do
            if [ "$(grep -oP "${arch}\\)\\s*KUBECTL_SHA=[a-f0-9]{64}(?![a-f0-9])" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${arch}-SHA-pin voor kubectl in de Dockerfile" >&2
              exit 1
            fi
            pin[$arch]=$(grep -oP "${arch}\\)\\s*KUBECTL_SHA=\\K[a-f0-9]{64}(?![a-f0-9])" Dockerfile)
          done
          # De gepubliceerde checksum vertrouwen, zoals node-version de
          # SHASUMS256.txt: hij komt van dezelfde host als de binary, dus zelf
          # downloaden en hashen zegt niets extra's over de herkomst. De build
          # toetst de binary ertegen.
          checksum() { # versie arch -> sha256
            local s
            if ! s=$(curl -fsSL "https://dl.k8s.io/release/$1/bin/linux/$2/kubectl.sha256"); then
              echo "FOUT: kon de $2-checksum van kubectl $1 niet ophalen" >&2
              return 1
            fi
            if ! [[ "$s" =~ ^[a-f0-9]{64}$ ]]; then
              echo "FOUT: '$s' is geen sha256 uit kubectl.sha256 voor $2 $1" >&2
              return 1
            fi
            printf '%s' "$s"
          }
          minor=${current%.*}
          if ! latest=$(curl -fsSL "https://dl.k8s.io/release/stable-${minor#v}.txt"); then
            echo "FOUT: kon stable-${minor#v}.txt niet ophalen van dl.k8s.io" >&2
            exit 1
          fi
          # De versie komt van buiten en belandt in curl- en sed-argumenten;
          # `=~` toetst de hele waarde, ook een tweede regel.
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FOUT: onverwachte kubectl-versie '$latest' in stable-${minor#v}.txt (verwacht: vX.Y.Z)" >&2
            exit 1
          fi
          if [ "${latest%.*}" != "$minor" ]; then
            echo "FOUT: stable-${minor#v}.txt noemt ${latest}, buiten de gepinde minor ${minor}" >&2
            exit 1
          fi
          if ! stable=$(curl -fsSL https://dl.k8s.io/release/stable.txt); then
            echo "FOUT: kon stable.txt niet ophalen van dl.k8s.io" >&2
            exit 1
          fi
          if ! [[ "$stable" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FOUT: onverwachte kubectl-versie '$stable' in stable.txt (verwacht: vX.Y.Z)" >&2
            exit 1
          fi
          # Numeriek: als tekst is v1.100 lager dan v1.35.
          nieuwere_minor=false
          if [ "${stable%.*}" != "$minor" ] \
             && [ "$(printf '%s\n%s\n' "$minor" "${stable%.*}" | sort -V | tail -1)" = "${stable%.*}" ]; then
            nieuwere_minor=true
            # Upstream ondersteunt de drie nieuwste minors. Daarbuiten komen er
            # geen patches en dus geen auto-PR meer; alleen een rode run valt op.
            s=${stable%.*}; s=${s#v}; p=${minor#v}
            if [ "${s%%.*}" != "${p%%.*}" ] || [ $(( 10#${s#*.} - 10#${p#*.} )) -ge 3 ]; then
              echo "FOUT: stable.txt staat op ${stable}; de gepinde minor ${minor} valt buiten de drie ondersteunde minors en krijgt geen patches meer. Kies een nieuwere minor (zie de comment bij de kubectl-laag in de Dockerfile)." >&2
              exit 1
            fi
            echo "::warning::stable.txt staat op ${stable}, een nieuwere minor dan de gepinde ${minor}; deze job bumpt alleen patches binnen ${minor}"
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "minor=$minor"
            echo "stable=$stable"
            echo "nieuwere_minor=$nieuwere_minor"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            # Een gewijzigde of verkeerd overgenomen checksum mag niet blijven
            # staan tot de volgende patch: CI bouwt de K8S-laag niet op arm64.
            for arch in amd64 arm64; do
              up=$(checksum "$current" "$arch") || exit 1
              if [ "$up" != "${pin[$arch]}" ]; then
                echo "FOUT: de ${arch}-SHA-pin van kubectl ${current} wijkt af van upstream (${up})" >&2
                exit 1
              fi
            done
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Een lagere versie dan de pin wijst op een kapotte of teruggezette
          # feed, niet op een gewenste downgrade.
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "FOUT: kubectl ${latest} uit stable-${minor#v}.txt is lager dan de pin ${current}" >&2
            exit 1
          fi
          declare -A sha
          for arch in amd64 arm64; do
            sha[$arch]=$(checksum "$latest" "$arch") || exit 1
          done
          vervang="${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh"
          "$vervang" Dockerfile "KUBECTL_VERSION=$current" "KUBECTL_VERSION=$latest" 1
          "$vervang" Dockerfile "KUBECTL_SHA=${pin[amd64]}" "KUBECTL_SHA=${sha[amd64]}" 1
          "$vervang" Dockerfile "KUBECTL_SHA=${pin[arm64]}" "KUBECTL_SHA=${sha[arm64]}" 1
          {
            echo "changed=true"
            echo "amd64=${sha[amd64]}"
            echo "arm64=${sha[arm64]}"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if kubectl changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/kubectl
          delete-branch: true
          commit-message: "chore(deps): bump kubectl naar ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump kubectl naar ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe kubectl-patch binnen de gepinde minor ${{ steps.compare.outputs.minor }}, gedetecteerd via
            `dl.k8s.io/release/stable-<minor>.txt`.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **SHA amd64:** `${{ steps.compare.outputs.amd64 }}`
            - **SHA arm64:** `${{ steps.compare.outputs.arm64 }}`
            - **Release notes:** https://github.com/kubernetes/kubernetes/releases/tag/${{ steps.compare.outputs.latest }}

            ${{ steps.compare.outputs.nieuwere_minor == 'true' && format('**Let op:** `stable.txt` staat op {0}, een nieuwere minor dan de gepinde {1}. Deze PR blijft binnen {1}; verzet de minor alleen bewust, als de clusterversies van Fundament dat vragen (zie de comment bij de kubectl-laag in de Dockerfile).', steps.compare.outputs.stable, steps.compare.outputs.minor) || '' }}

            Loop bij het reviewen `.trivyignore.yaml` na: staat er een suppressie op `usr/local/bin/kubectl`
            die deze release oplost, haal die dan weg.

            Verifieer lokaal met `INSTALL_FUNDAMENT=true docker compose build --no-cache` voor je merget.
            Deze PR is door `GITHUB_TOKEN` geopend en start daardoor geen workflow-runs; sluit en
            heropen hem om de checks alsnog te laten draaien.

  # Job 4b: helm — de laatste release binnen de gepinde major. helm brengt v3 en
  # v4 naast elkaar uit, dus releases/latest kan een v3-patch zijn; de job kiest
  # zelf uit de lijst. Een nieuwe major wordt gemeld, niet gebumpt. Bij een
  # nieuwe minor verschuiven de vermeldingen in de README en docs/kubernetes.md mee.
  helm-version:
    name: helm-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine latest helm release within the pinned major and compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(grep -oE 'HELM_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige HELM_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Precies één pin verwachten; zie de toelichting bij node-version.
          if [ "$(grep -oE 'HELM_VERSION=' Dockerfile | wc -l)" -ne 1 ]; then
            echo "FOUT: verwacht precies één HELM_VERSION-pin in de Dockerfile" >&2
            exit 1
          fi
          # Zie kubectl-version: ook zonder nieuwe release, en op eigen namen.
          declare -A pin
          for arch in amd64 arm64; do
            if [ "$(grep -oP "${arch}\\)\\s*HELM_SHA=[a-f0-9]{64}(?![a-f0-9])" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${arch}-SHA-pin voor helm in de Dockerfile" >&2
              exit 1
            fi
            pin[$arch]=$(grep -oP "${arch}\\)\\s*HELM_SHA=\\K[a-f0-9]{64}(?![a-f0-9])" Dockerfile)
          done
          # Zie kubectl-version: de gepubliceerde checksum van get.helm.sh.
          checksum() { # versie arch -> sha256
            local bestand="helm-$1-linux-$2.tar.gz" sums s
            if ! sums=$(curl -fsSL "https://get.helm.sh/${bestand}.sha256sum"); then
              echo "FOUT: kon de checksum van ${bestand} niet ophalen" >&2
              return 1
            fi
            s=$(awk -v f="$bestand" '$2 == f {print $1}' <<<"$sums")
            if ! [[ "$s" =~ ^[a-f0-9]{64}$ ]]; then
              echo "FOUT: '$s' is geen sha256 uit ${bestand}.sha256sum" >&2
              return 1
            fi
            printf '%s' "$s"
          }
          major=${current%%.*}
          # Alle pagina's: v3 en v4 krijgen naast elkaar patches, dus de nieuwste
          # v4 staat niet gegarandeerd op de eerste.
          if ! releases=$(gh api --paginate 'repos/helm/helm/releases?per_page=100'); then
            echo "FOUT: kon de releases van helm/helm niet ophalen via de GitHub API" >&2
            exit 1
          fi
          # De tags komen uit een repository van derden en belanden in curl- en
          # sed-argumenten. Dit filter is de vormtoets: alleen gepubliceerde,
          # stabiele vX.Y.Z-tags gaan verder, de rest valt weg. `\A…\z` en niet
          # `^…$`: `$` laat in jq een afsluitende newline door. Numeriek
          # sorteren: de volgorde van de API is geen contract, en als tekst is
          # v4.10 lager dan v4.9. `--paginate` levert de pagina's als losse
          # lijsten achter elkaar; `jq -s` en `.[][]` voegen ze samen.
          stabiel='[.[][] | select(.draft == false and .prerelease == false) | .tag_name | strings
                    | select(test("\\Av[0-9]+\\.[0-9]+\\.[0-9]+\\z"))]
                   | sort_by(ltrimstr("v") | split(".") | map(tonumber))'
          if ! latest=$(jq -rs --arg m "${major#v}" "$stabiel"' | map(select(ltrimstr("v") | split(".")[0] == $m)) | last // empty' <<<"$releases") \
             || ! hoogste=$(jq -rs "$stabiel"' | last // empty' <<<"$releases") \
             || ! bekend=$(jq -rs --arg c "$current" "$stabiel"' | any(.[]; . == $c)' <<<"$releases"); then
            echo "FOUT: de releases van helm/helm zijn geen leesbare JSON-lijst" >&2
            exit 1
          fi
          if [ -z "$latest" ]; then
            echo "FOUT: kon geen stabiele helm-release binnen major ${major} vinden" >&2
            exit 1
          fi
          # Ontbreekt de pin zelf, dan is de lijst onvolledig of teruggezet en
          # zegt "geen nieuwere release" niets. Staat hij erin, dan is latest
          # nooit lager dan de pin.
          if [ "$bekend" != true ]; then
            echo "FOUT: de gepinde helm ${current} staat niet tussen de stabiele releases van helm/helm" >&2
            exit 1
          fi
          nieuwe_major=false
          if [ "${hoogste%%.*}" != "$major" ]; then
            nieuwe_major=true
            echo "::warning::helm ${hoogste} is uit, een nieuwere major dan de gepinde ${major}; deze job bumpt alleen binnen ${major}"
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "major=$major"
            echo "hoogste=$hoogste"
            echo "nieuwe_major=$nieuwe_major"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            # Zie kubectl-version: ook de pins van de huidige versie toetsen.
            for arch in amd64 arm64; do
              up=$(checksum "$current" "$arch") || exit 1
              if [ "$up" != "${pin[$arch]}" ]; then
                echo "FOUT: de ${arch}-SHA-pin van helm ${current} wijkt af van upstream (${up})" >&2
                exit 1
              fi
            done
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declare -A sha
          for arch in amd64 arm64; do
            sha[$arch]=$(checksum "$latest" "$arch") || exit 1
          done
          vervang="${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh"
          "$vervang" Dockerfile "HELM_VERSION=$current" "HELM_VERSION=$latest" 1
          "$vervang" Dockerfile "HELM_SHA=${pin[amd64]}" "HELM_SHA=${sha[amd64]}" 1
          "$vervang" Dockerfile "HELM_SHA=${pin[arm64]}" "HELM_SHA=${sha[arm64]}" 1
          # De README en docs/kubernetes.md noemen alleen major.minor, zonder v.
          # Met de omringende tekst erbij, zodat een ander getal met dezelfde
          # cijfers blijft staan; vervang-pin.sh weigert die tekens, dus perl
          # met \Q…\E. Precies één treffer per bestand.
          vermelding() { # bestand oud nieuw
            local n
            n=$(grep -oF -- "$2" "$1" | wc -l || true)
            if [ "$n" -ne 1 ]; then
              echo "FOUT: '$2' komt ${n}× voor in $1, verwacht 1×" >&2
              return 1
            fi
            OUD="$2" NIEUW="$3" perl -pi -e 's/\Q$ENV{OUD}\E/$ENV{NIEUW}/g' "$1"
            echo "$1: $2 -> $3 (1×)"
          }
          oud_mm=${current#v}; oud_mm=${oud_mm%.*}
          nieuw_mm=${latest#v}; nieuw_mm=${nieuw_mm%.*}
          if [ "$oud_mm" != "$nieuw_mm" ]; then
            vermelding README.md "helm ${oud_mm} (" "helm ${nieuw_mm} ("
            vermelding docs/kubernetes.md "\`helm\` (${oud_mm})" "\`helm\` (${nieuw_mm})"
          fi
          {
            echo "changed=true"
            echo "amd64=${sha[amd64]}"
            echo "arm64=${sha[arm64]}"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if helm changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/helm
          delete-branch: true
          commit-message: "chore(deps): bump helm naar ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump helm naar ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            Nieuwe helm-release binnen major ${{ steps.compare.outputs.major }} gedetecteerd op GitHub. Bij een
            nieuwe minor-versie zijn ook de vermeldingen in `README.md` en `docs/kubernetes.md` bijgewerkt.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **SHA amd64:** `${{ steps.compare.outputs.amd64 }}`
            - **SHA arm64:** `${{ steps.compare.outputs.arm64 }}`
            - **Release notes:** https://github.com/helm/helm/releases/tag/${{ steps.compare.outputs.latest }}

            ${{ steps.compare.outputs.nieuwe_major == 'true' && format('**Let op:** helm {0} is uit, een nieuwere major dan de gepinde {1}. Deze PR blijft binnen {1}; een major-sprong is een eigen afweging (charts, plug-ins, de documentatie in `docs/kubernetes.md`).', steps.compare.outputs.hoogste, steps.compare.outputs.major) || '' }}

            Loop bij het reviewen `.trivyignore.yaml` na: staat er een suppressie op `usr/local/bin/helm`
            die deze release oplost, haal die dan weg, met de melding erover in `docs/kubernetes.md`.

            Verifieer lokaal met `INSTALL_FUNDAMENT=true docker compose build --no-cache` voor je merget.
            Deze PR is door `GITHUB_TOKEN` geopend en start daardoor geen workflow-runs; sluit en
            heropen hem om de checks alsnog te laten draaien.

  # Job 4c: just — volgt de mise.toml die de gepinde functl in een nieuwe
  # plug-in schrijft, niet de nieuwste just: zo bouwt de sandbox met dezelfde
  # just als de scaffold vraagt. Na een functl-bump stelt deze job de bijpassende
  # just voor. Bij een nieuwe minor verschuift de vermelding in de README mee.
  just-version:
    name: just-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine the just of the pinned functl scaffold and compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for naam in JUST_VERSION FUNCTL_VERSION; do
            if [ "$(grep -oE "${naam}=" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${naam}-pin in de Dockerfile" >&2
              exit 1
            fi
          done
          current=$(grep -oE 'JUST_VERSION=[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | cut -d= -f2 || true)
          if [ -z "$current" ]; then
            echo "FOUT: kon huidige JUST_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # De commit van de gepinde functl: de laatste twaalf tekens van de
          # pseudo-versie.
          commit=$(grep -oE 'FUNCTL_VERSION=v0\.0\.0-[0-9]{14}-[0-9a-f]{12}' Dockerfile | grep -oE '[0-9a-f]{12}$' || true)
          if [ -z "$commit" ]; then
            echo "FOUT: kon de commit van FUNCTL_VERSION niet uit Dockerfile lezen" >&2
            exit 1
          fi
          # Zie kubectl-version: ook zonder nieuwe versie, en op eigen namen.
          declare -A pin
          for arch in amd64 arm64; do
            if [ "$(grep -oP "${arch}\\)\\s*JUST_SHA=[a-f0-9]{64}(?![a-f0-9])" Dockerfile | wc -l)" -ne 1 ]; then
              echo "FOUT: verwacht precies één ${arch}-SHA-pin voor just in de Dockerfile" >&2
              exit 1
            fi
            pin[$arch]=$(grep -oP "${arch}\\)\\s*JUST_SHA=\\K[a-f0-9]{64}(?![a-f0-9])" Dockerfile)
          done
          sjabloon=functl/pkg/scaffold/templates/base/mise.toml.tmpl
          if ! toml=$(gh api -H 'Accept: application/vnd.github.raw' \
                        "repos/fundament-oss/fundament/contents/${sjabloon}?ref=${commit}"); then
            echo "FOUT: kon ${sjabloon} van fundament-oss/fundament op ${commit} niet ophalen" >&2
            exit 1
          fi
          # De waarde komt uit een repository van derden en belandt in curl- en
          # sed-argumenten: precies één regel `just = "X.Y.Z"`, anders stoppen.
          regels=$(grep -cE '^just[[:space:]]*=' <<<"$toml" || true)
          if [ "$regels" -ne 1 ]; then
            echo "FOUT: verwacht precies één just-regel in ${sjabloon}, gevonden: ${regels}" >&2
            exit 1
          fi
          latest=$(sed -nE 's/^just[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' <<<"$toml")
          if [ -z "$latest" ]; then
            echo "FOUT: de just-regel in ${sjabloon} is geen \"X.Y.Z\": $(grep -E '^just[[:space:]]*=' <<<"$toml")" >&2
            exit 1
          fi
          if ! sums=$(curl -fsSL "https://github.com/casey/just/releases/download/${latest}/SHA256SUMS"); then
            echo "FOUT: kon SHA256SUMS van just ${latest} niet ophalen" >&2
            exit 1
          fi
          declare -A triple=([amd64]=x86_64-unknown-linux-musl [arm64]=aarch64-unknown-linux-musl)
          declare -A sha
          for arch in amd64 arm64; do
            bestand="just-${latest}-${triple[$arch]}.tar.gz"
            sha[$arch]=$(awk -v f="$bestand" '$2 == f {print $1}' <<<"$sums")
            if ! [[ "${sha[$arch]}" =~ ^[a-f0-9]{64}$ ]]; then
              echo "FOUT: '${sha[$arch]}' is geen sha256 voor ${bestand} in SHA256SUMS" >&2
              exit 1
            fi
          done
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            # Zie kubectl-version: ook de pins van de huidige versie toetsen.
            for arch in amd64 arm64; do
              if [ "${sha[$arch]}" != "${pin[$arch]}" ]; then
                echo "FOUT: de ${arch}-SHA-pin van just ${current} wijkt af van upstream (${sha[$arch]})" >&2
                exit 1
              fi
            done
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          vervang="${GITHUB_WORKSPACE}/.github/scripts/vervang-pin.sh"
          "$vervang" Dockerfile "JUST_VERSION=$current" "JUST_VERSION=$latest" 1
          "$vervang" Dockerfile "JUST_SHA=${pin[amd64]}" "JUST_SHA=${sha[amd64]}" 1
          "$vervang" Dockerfile "JUST_SHA=${pin[arm64]}" "JUST_SHA=${sha[arm64]}" 1
          # De README noemt alleen major.minor, met de komma erachter: zo blijft
          # een ander getal met dezelfde cijfers staan. Zie helm-version.
          oud_mm=${current%.*}
          nieuw_mm=${latest%.*}
          if [ "$oud_mm" != "$nieuw_mm" ]; then
            n=$(grep -oF -- "just ${oud_mm}," README.md | wc -l || true)
            if [ "$n" -ne 1 ]; then
              echo "FOUT: 'just ${oud_mm},' komt ${n}× voor in README.md, verwacht 1×" >&2
              exit 1
            fi
            OUD="just ${oud_mm}," NIEUW="just ${nieuw_mm}," perl -pi -e 's/\Q$ENV{OUD}\E/$ENV{NIEUW}/g' README.md
            echo "README.md: just ${oud_mm}, -> just ${nieuw_mm}, (1×)"
          fi
          {
            echo "changed=true"
            echo "amd64=${sha[amd64]}"
            echo "arm64=${sha[arm64]}"
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-PR if just changed
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/just
          delete-branch: true
          commit-message: "chore(deps): bump just naar ${{ steps.compare.outputs.latest }}"
          title: "chore(deps): bump just naar ${{ steps.compare.outputs.latest }}"
          labels: dependencies
          body: |
            De scaffold van de gepinde functl (commit `${{ steps.compare.outputs.commit }}`) vraagt een andere
            just in zijn `mise.toml`. Bij een nieuwe minor-versie is ook de vermelding in `README.md` bijgewerkt.

            - **Oude versie:** `${{ steps.compare.outputs.current }}`
            - **Nieuwe versie:** `${{ steps.compare.outputs.latest }}`
            - **SHA amd64:** `${{ steps.compare.outputs.amd64 }}`
            - **SHA arm64:** `${{ steps.compare.outputs.arm64 }}`
            - **Release notes:** https://github.com/casey/just/releases/tag/${{ steps.compare.outputs.latest }}

            Verifieer lokaal met `INSTALL_FUNDAMENT=true docker compose build --no-cache` voor je merget.
            Deze PR is door `GITHUB_TOKEN` geopend en start daardoor geen workflow-runs; sluit en
            heropen hem om de checks alsnog te laten draaien.
