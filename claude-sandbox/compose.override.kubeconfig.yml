# Toegang tot een Kubernetes-cluster buiten de container: mount een kubeconfig
# van de host read-only in de sandbox. Vereist een image gebouwd met
# INSTALL_K8S=true. Lees eerst docs/kubernetes.md: met deze toegang bereikt
# Claude via het cluster meer dan de firewall van de sandbox toelaat.
#
# Geef expliciet mee met -f (NIET hernoemen naar compose.override.yml — dat zou
# auto-laden en de toegangsgegevens bij elke `docker compose up` meegeven):
#   docker compose -f compose.yml -f compose.override.kubeconfig.yml up -d
services:
  claude:
    volumes:
      # Het doel ligt buiten /home/claude: een mountpunt in het claude-home
      # volume blijft daar als leeg root-bestand achter, ook na een start zonder
      # deze override, en dan weigert kubectl ~/.kube/config. Read-only, zodat
      # de sandbox de kubeconfig niet kan aanpassen; lezen, en dus het token
      # kopiëren, kan wel.
      - type: bind
        source: "${SANDBOX_KUBECONFIG:?zet SANDBOX_KUBECONFIG in .env op het pad naar de kubeconfig op de host}"
        target: /run/kubeconfig/config
        read_only: true
    environment:
      - KUBECONFIG=/run/kubeconfig/config
      # helm bewaart releases standaard in Secrets. De aanbevolen rol voor de
      # sandbox mag geen Secrets aanmaken: daarmee kan hij zelf een token
      # zonder einddatum laten uitgeven. Met een rol die dat wel mag (Fundament
      # Project admin) kan helm in de sandbox terug naar HELM_DRIVER=secret.
      - HELM_DRIVER=configmap
